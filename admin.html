<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — ระบบหลังบ้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #f2f2f7;
  --bg-2: #ffffff;
  --bg-3: #e5e5ea;
  --surface: rgba(255,255,255,0.9);
  --border: rgba(0,0,0,0.09);
  --border-bright: rgba(0,0,0,0.16);

  --gold: #b07d0f;
  --gold-bright: #c9920e;
  --gold-soft: #a06a0a;

  --text: rgba(0,0,0,0.85);
  --text-dim: rgba(0,0,0,0.55);
  --text-mute: rgba(0,0,0,0.35);

  --up: #34c759;
  --down: #ff3b30;

  --sans: -apple-system, BlinkMacSystemFont, 'Noto Serif Thai', 'Segoe UI', sans-serif;
  --serif-th: 'Noto Serif Thai', serif;
  --mono: 'IBM Plex Mono', monospace;

  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; min-height: 100vh; }
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Login */
.login-wrap {
  min-height: 100vh; display: grid; place-items: center; padding: 20px;
  background: var(--bg);
}
.login-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 40px 36px; width: 100%; max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.login-logo {
  display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
}
.login-icon {
  width: 34px; height: 34px; border-radius: 8px;
  background: linear-gradient(145deg, #f5c542, #c9a24a);
  display: grid; place-items: center;
  font-size: 17px; font-weight: 800; color: #1a1208;
  font-family: var(--serif-th); box-shadow: 0 2px 8px rgba(245,197,66,0.35);
}
.login-title { font-size: 17px; font-weight: 600; color: var(--text); }
.login-sub { font-size: 12px; color: var(--text-mute); margin-bottom: 28px; }

/* Fields */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; color: var(--text-mute); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; font-family: var(--mono); }
.f-input { border: 1px solid var(--border-bright); border-radius: var(--radius-sm); background: var(--bg-2); overflow: hidden; }
.f-input input, .f-input select {
  background: transparent; border: none; color: var(--text);
  font-family: var(--mono); font-size: 14px; padding: 10px 12px; outline: none; width: 100%;
}
.f-input select { color: var(--text-dim); }
.f-input select option { background: var(--bg-2); color: var(--text); }

/* Buttons */
.btn-primary {
  background: var(--gold-soft); color: #1a1208; font-weight: 700;
  border: 1px solid var(--gold); border-radius: var(--radius-sm);
  padding: 10px 20px; font-size: 13px; cursor: pointer; transition: all 0.15s;
  box-shadow: 0 2px 8px rgba(245,197,66,0.25);
}
.btn-primary:disabled { background: var(--bg-3); color: var(--text-mute); border-color: var(--border); box-shadow: none; cursor: not-allowed; }
.btn-primary:hover:not(:disabled) { background: var(--gold); box-shadow: 0 3px 12px rgba(245,197,66,0.4); }
.btn-ghost {
  background: var(--bg-3); color: var(--text-dim); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 7px 14px; font-size: 12px; cursor: pointer; transition: all 0.15s;
}
.btn-ghost:hover { color: var(--text); background: var(--bg-2); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-danger {
  background: rgba(255,69,58,0.1); color: var(--down);
  border: 1px solid rgba(255,69,58,0.3); border-radius: var(--radius-sm);
  padding: 5px 10px; font-size: 12px; cursor: pointer; transition: all 0.15s;
}
.btn-danger:hover { background: rgba(255,69,58,0.2); border-color: var(--down); }
.btn-w100 { width: 100%; }

/* Admin layout */
.admin-wrap { display: grid; grid-template-rows: auto auto 1fr; min-height: 100vh; }
.admin-header {
  height: 52px; border-bottom: 1px solid var(--border); padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,0.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  position: sticky; top: 0; z-index: 10;
}
.admin-brand { display: flex; align-items: center; gap: 10px; }
.admin-brand-icon {
  width: 26px; height: 26px; border-radius: 6px;
  background: linear-gradient(145deg, #f5c542, #c9a24a);
  display: grid; place-items: center;
  font-size: 12px; font-weight: 800; color: #1a1208;
  box-shadow: 0 1px 4px rgba(245,197,66,0.3);
}
.admin-brand-text { font-size: 14px; font-weight: 600; color: var(--text); }

/* Tab bar */
.tab-bar {
  display: flex; border-bottom: 1px solid var(--border);
  background: rgba(242,242,247,0.8); padding: 0 24px; overflow-x: auto;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab {
  background: transparent; border: none; color: var(--text-mute);
  padding: 12px 16px; font-size: 13px; border-bottom: 2px solid transparent;
  margin-bottom: -1px; white-space: nowrap; transition: all 0.15s;
  font-family: var(--serif-th); cursor: pointer;
}
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab:hover:not(.active) { color: var(--text-dim); }

/* Content */
.content { padding: 24px; max-width: 1100px; }

/* Cards */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 22px; margin-bottom: 16px;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 2px 16px rgba(0,0,0,0.3);
}
.card-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 18px; }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; color: var(--text-mute); font-size: 11px; letter-spacing: 0.06em;
  text-transform: uppercase; padding: 10px 14px; border-bottom: 1px solid var(--border);
  background: var(--bg-3); font-weight: 500; font-family: var(--mono);
}
td { padding: 12px 14px; border-top: 1px solid var(--border); color: var(--text-dim); vertical-align: middle; }
tr:hover td { background: rgba(0,0,0,0.02); }
.mono { font-family: var(--mono); color: var(--gold); font-size: 12px; }
.badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-family: var(--mono); font-weight: 500; }
.badge.on { background: rgba(50,215,75,0.12); color: var(--up); }
.badge.off { background: rgba(255,69,58,0.12); color: var(--down); }

/* Forms */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

.num-wrap { border: 1px solid var(--border-bright); border-radius: var(--radius-sm); background: var(--bg-2); overflow: hidden; }
.num-wrap input { background: transparent; border: none; color: var(--gold-bright); font-family: var(--mono); font-size: 14px; padding: 10px 12px; outline: none; width: 100%; }

/* Messages */
.msg-ok {
  background: rgba(50,215,75,0.1); border: 1px solid rgba(50,215,75,0.3);
  border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12px; color: var(--up); margin-top: 12px;
}
.msg-err {
  background: rgba(255,69,58,0.1); border: 1px solid rgba(255,69,58,0.3);
  border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12px; color: var(--down); margin-top: 12px;
}

.spinner { display: grid; place-items: center; padding: 60px; color: var(--text-mute); font-size: 13px; font-family: var(--mono); }

/* ── Responsive ── */
@media (max-width: 768px) {
  .admin-header { padding: 0 16px; }
  .tab-bar { padding: 0 16px; }
  .content { padding: 16px; max-width: 100%; }
  .card { padding: 18px; }
  .form-grid { grid-template-columns: 1fr; }
  table { font-size: 12px; }
  th, td { padding: 10px 10px; }
}

@media (max-width: 480px) {
  .admin-header { height: 48px; }
  .admin-brand-text { font-size: 13px; }
  .tab-bar { padding: 0 10px; }
  .tab { padding: 10px 12px; font-size: 12px; }
  .content { padding: 12px; }
  .card { padding: 14px; margin-bottom: 12px; }
  .card-title { font-size: 12px; margin-bottom: 14px; }
  .btn-primary, .btn-ghost { padding: 11px 16px; font-size: 13px; min-height: 44px; }
  .f-input input, .f-input select { font-size: 15px; padding: 11px 12px; }

  /* Table → card list on mobile */
  table thead { display: none; }
  table, tbody, tr, td { display: block; width: 100%; }
  tr { padding: 12px 0; border-top: 1px solid var(--border); }
  tr:first-child { border-top: none; }
  td { border: none; padding: 2px 0; }
  td:last-child { padding-top: 8px; }

  .login-box { padding: 28px 20px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const SUPABASE_URL = 'https://cplpzqijglqrtnfrepsu.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwbHB6cWlqZ2xxcnRuZnJlcHN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NDE2NDMsImV4cCI6MjA5NDUxNzY0M30.sbvDH-1SmWqURDKCP0eYEvGUmoopwVIIrEu3gqHyvWk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const fmtNum = n => Number(n || 0).toLocaleString('th-TH');
const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thaiDt = s => {
  const d = new Date(s);
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()+543} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};

/* ── Login ── */
function LoginPage({ onLogin }) {
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    if (!email || !pw) return;
    setLoading(true); setErr('');
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) { setErr('อีเมลหรือรหัสผ่านไม่ถูกต้อง'); setLoading(false); }
    else onLogin();
  };

  return (
    <div className="login-wrap">
      <div className="login-box">
        <div className="login-logo">
          <div className="login-icon">G</div>
          <div className="login-title">ระบบหลังบ้าน</div>
        </div>
        <div className="login-sub">Gold Admin · กรุณาเข้าสู่ระบบ</div>
        <div className="field">
          <label>อีเมล</label>
          <div className="f-input"><input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} placeholder="admin@example.com" autoFocus /></div>
        </div>
        <div className="field">
          <label>รหัสผ่าน</label>
          <div className="f-input"><input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} /></div>
        </div>
        {err && <div className="msg-err">{err}</div>}
        <div style={{marginTop:20}}>
          <button className="btn-primary btn-w100" onClick={submit} disabled={loading||!email||!pw}>
            {loading ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบ'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Tab: สาขา ── */
function BranchesTab() {
  const [list, setList] = useState([]);
  const [name, setName] = useState('');
  const [hostname, setHostname] = useState('');
  const [err, setErr] = useState('');
  const [msg, setMsg] = useState('');

  const load = () => sb.from('branches').select('*').order('created_at').then(({ data }) => data && setList(data));
  useEffect(() => { load(); }, []);

  const add = async () => {
    if (!name.trim() || !hostname.trim()) { setErr('กรุณากรอกชื่อสาขาและ Hostname'); return; }
    const { error } = await sb.from('branches').insert({ name: name.trim(), hostname: hostname.trim().toLowerCase() });
    if (error) { setErr(error.message); return; }
    setName(''); setHostname(''); setMsg('เพิ่มสาขาเรียบร้อย'); setErr(''); load();
  };

  const toggle = async (id, active) => {
    await sb.from('branches').update({ active: !active }).eq('id', id);
    load();
  };

  return (
    <div>
      <div className="card">
        <div className="card-title">เพิ่มสาขาใหม่</div>
        <div className="form-grid">
          <div className="field">
            <label>ชื่อสาขา / ชื่อร้าน</label>
            <div className="f-input"><input value={name} onChange={e=>setName(e.target.value)} placeholder="เช่น ห้างทอง รัตนกาญจน์" /></div>
          </div>
          <div className="field">
            <label>Hostname (URL บน Vercel)</label>
            <div className="f-input"><input value={hostname} onChange={e=>setHostname(e.target.value)} placeholder="goldmark-branch1.vercel.app" /></div>
          </div>
        </div>
        <button className="btn-primary" onClick={add}>+ เพิ่มสาขา</button>
        {err && <div className="msg-err">{err}</div>}
        {msg && <div className="msg-ok">{msg}</div>}
      </div>

      <div className="card">
        <div className="card-title">รายชื่อสาขาทั้งหมด ({list.length})</div>
        {list.length === 0 ? (
          <div style={{color:'var(--text-mute)',fontSize:13,padding:'20px 0',fontFamily:'var(--mono)'}}>ยังไม่มีสาขา</div>
        ) : (
          <div style={{overflowX:'auto'}}>
            <table>
              <thead><tr>
                <th>ชื่อสาขา / ชื่อร้าน</th><th>Hostname</th><th>สถานะ</th><th>วันที่สร้าง</th><th></th>
              </tr></thead>
              <tbody>{list.map(b => (
                <tr key={b.id}>
                  <td style={{fontWeight:600,color:'var(--text)'}}>{b.name}</td>
                  <td className="mono">{b.hostname}</td>
                  <td><span className={`badge ${b.active?'on':'off'}`}>{b.active?'ใช้งาน':'ปิด'}</span></td>
                  <td style={{color:'var(--text-mute)',fontSize:12,fontFamily:'var(--mono)'}}>{thaiDt(b.created_at)}</td>
                  <td><button className="btn-ghost btn-sm" onClick={()=>toggle(b.id,b.active)}>{b.active?'ปิดสาขา':'เปิดสาขา'}</button></td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        )}
        <div style={{marginTop:14,padding:'10px 14px',background:'rgba(245,197,66,0.06)',borderRadius:'var(--radius-sm)',border:'1px solid rgba(245,197,66,0.15)',fontSize:12,color:'var(--text-mute)'}}>
          💡 <strong style={{color:'var(--text-dim)'}}>ชื่อสาขา</strong> จะแสดงเป็นชื่อร้านในใบประเมินราคาโดยอัตโนมัติ
        </div>
      </div>
    </div>
  );
}

/* ── Tab: พนักงาน ── */
function EmployeesTab({ branches }) {
  const [list, setList] = useState([]);
  const [name, setName] = useState('');
  const [idCard, setIdCard] = useState('');
  const [branchId, setBranchId] = useState('');
  const [filterBranch, setFilterBranch] = useState('');
  const [err, setErr] = useState('');
  const [msg, setMsg] = useState('');

  const load = () => sb.from('employees').select('*, branches(name)').order('created_at').then(({ data }) => data && setList(data));
  useEffect(() => { load(); if (branches.length && !branchId) setBranchId(branches[0].id); }, [branches]);

  const add = async () => {
    if (!name.trim()) { setErr('กรุณากรอกชื่อ'); return; }
    if (idCard.length !== 13) { setErr('เลขบัตรต้องมี 13 หลัก'); return; }
    if (!branchId) { setErr('กรุณาเลือกสาขา'); return; }
    const { error } = await sb.from('employees').insert({ id_card: idCard, name: name.trim(), branch_id: branchId });
    if (error) { setErr(error.code === '23505' ? 'เลขบัตรนี้มีอยู่ในระบบแล้ว' : error.message); return; }
    setName(''); setIdCard(''); setMsg('เพิ่มพนักงานเรียบร้อย'); setErr(''); load();
  };

  const toggle = async (id_card, active) => {
    await sb.from('employees').update({ active: !active }).eq('id_card', id_card);
    load();
  };

  const filtered = filterBranch ? list.filter(e => e.branch_id === filterBranch) : list;

  return (
    <div>
      <div className="card">
        <div className="card-title">เพิ่มพนักงาน</div>
        <div className="form-grid">
          <div className="field">
            <label>ชื่อ-นามสกุล</label>
            <div className="f-input"><input value={name} onChange={e=>setName(e.target.value)} placeholder="ชื่อพนักงาน" /></div>
          </div>
          <div className="field">
            <label>เลขบัตรประชาชน 13 หลัก</label>
            <div className="f-input"><input type="text" inputMode="numeric" maxLength={13} value={idCard}
              onChange={e=>setIdCard(e.target.value.replace(/\D/g,''))}
              placeholder="0000000000000" style={{fontFamily:'var(--mono)',letterSpacing:'0.1em'}} /></div>
            <div style={{fontSize:11,color:'var(--text-mute)',marginTop:4,fontFamily:'var(--mono)'}}>{idCard.length}/13</div>
          </div>
          <div className="field">
            <label>สาขา</label>
            <div className="f-input"><select value={branchId} onChange={e=>setBranchId(e.target.value)}>
              <option value="">-- เลือกสาขา --</option>
              {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
            </select></div>
          </div>
        </div>
        <button className="btn-primary" onClick={add}>+ เพิ่มพนักงาน</button>
        {err && <div className="msg-err">{err}</div>}
        {msg && <div className="msg-ok">{msg}</div>}
      </div>

      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexWrap:'wrap',gap:12}}>
          <div className="card-title" style={{marginBottom:0}}>รายชื่อพนักงาน ({filtered.length})</div>
          <div className="f-input" style={{minWidth:180}}>
            <select value={filterBranch} onChange={e=>setFilterBranch(e.target.value)}>
              <option value="">ทุกสาขา</option>
              {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
            </select>
          </div>
        </div>
        {filtered.length === 0 ? (
          <div style={{color:'var(--text-mute)',fontSize:13,padding:'20px 0',fontFamily:'var(--mono)'}}>ยังไม่มีพนักงาน</div>
        ) : (
          <div style={{overflowX:'auto'}}>
            <table>
              <thead><tr><th>ชื่อ</th><th>เลขบัตร</th><th>สาขา</th><th>สถานะ</th><th></th></tr></thead>
              <tbody>{filtered.map(e => (
                <tr key={e.id_card}>
                  <td style={{fontWeight:600,color:'var(--text)'}}>{e.name}</td>
                  <td className="mono">{e.id_card}</td>
                  <td style={{color:'var(--text-dim)'}}>{e.branches?.name ?? '—'}</td>
                  <td><span className={`badge ${e.active?'on':'off'}`}>{e.active?'ใช้งาน':'ระงับ'}</span></td>
                  <td>
                    <button className={e.active?'btn-danger btn-sm':'btn-ghost btn-sm'} onClick={()=>toggle(e.id_card,e.active)}>
                      {e.active?'ระงับ':'เปิดใช้'}
                    </button>
                  </td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── Tab: สูตรคำนวณ ── */
function ConfigsTab({ branches }) {
  const [selBranch, setSelBranch] = useState('');
  const [vals, setVals] = useState({
    bar:     { labor_fee_min:0, labor_fee_max:0, discount_pct_min:0, discount_pct_max:0, discount_max_baht:0 },
    jewelry: { labor_fee_min:0, labor_fee_max:0, discount_pct_min:0, discount_pct_max:0, discount_max_baht:0 },
  });
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');
  const [err, setErr] = useState('');

  useEffect(() => { if (branches.length && !selBranch) setSelBranch(branches[0].id); }, [branches]);

  useEffect(() => {
    if (!selBranch) return;
    setMsg(''); setErr('');
    sb.from('branch_configs').select('*').eq('branch_id', selBranch).then(({ data }) => {
      if (!data) return;
      const next = {
        bar:     { labor_fee_min:0, labor_fee_max:0, discount_pct_min:0, discount_pct_max:0, discount_max_baht:0 },
        jewelry: { labor_fee_min:0, labor_fee_max:0, discount_pct_min:0, discount_pct_max:0, discount_max_baht:0 },
      };
      data.forEach(c => { if (next[c.gold_type]) Object.assign(next[c.gold_type], c); });
      setVals(next);
    });
  }, [selBranch]);

  const set = (type, key, v) => setVals(prev => ({ ...prev, [type]: { ...prev[type], [key]: Number(v)||0 } }));

  const save = async () => {
    if (!selBranch) return;
    setSaving(true); setMsg(''); setErr('');
    for (const type of ['bar', 'jewelry']) {
      const { error } = await sb.from('branch_configs').upsert(
        { branch_id: selBranch, gold_type: type, ...vals[type], updated_at: new Date().toISOString() },
        { onConflict: 'branch_id,gold_type' }
      );
      if (error) { setErr('บันทึกไม่สำเร็จ: ' + error.message); setSaving(false); return; }
    }
    setSaving(false); setMsg('บันทึกเรียบร้อย');
  };

  const NumField = ({ label, type, field }) => (
    <div className="field">
      <label>{label}</label>
      <div className="num-wrap"><input type="number" min={0} step={1} value={vals[type][field]} onChange={e=>set(type,field,e.target.value)} /></div>
    </div>
  );

  const typeNames = { bar: 'ทองคำแท่ง 96.5%', jewelry: 'ทองรูปพรรณ 96.5%' };

  return (
    <div>
      <div className="card">
        <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:22,flexWrap:'wrap'}}>
          <div className="card-title" style={{marginBottom:0}}>สูตรคำนวณ</div>
          <div className="f-input" style={{minWidth:220}}>
            <select value={selBranch} onChange={e=>setSelBranch(e.target.value)}>
              <option value="">-- เลือกสาขา --</option>
              {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
            </select>
          </div>
        </div>

        {['bar','jewelry'].map(type => (
          <div key={type} style={{marginBottom:28}}>
            <div style={{
              fontSize:12,fontWeight:600,color:'var(--gold)',marginBottom:14,paddingBottom:10,
              borderBottom:'1px solid var(--border)',fontFamily:'var(--mono)',letterSpacing:'0.04em'
            }}>
              {typeNames[type]}
            </div>
            <div className="form-grid">
              <NumField label="ค่ากำเหน็จต่ำสุด (บาท)" type={type} field="labor_fee_min" />
              <NumField label="ค่ากำเหน็จสูงสุด (บาท)" type={type} field="labor_fee_max" />
              <NumField label="ส่วนลดต่ำสุด (%)" type={type} field="discount_pct_min" />
              <NumField label="ส่วนลดสูงสุด (%)" type={type} field="discount_pct_max" />
              <NumField label="ส่วนลดสูงสุด (บาท)" type={type} field="discount_max_baht" />
            </div>
          </div>
        ))}

        <button className="btn-primary" onClick={save} disabled={!selBranch||saving}>
          {saving ? 'กำลังบันทึก...' : 'บันทึกสูตร'}
        </button>
        {msg && <div className="msg-ok">{msg}</div>}
        {err && <div className="msg-err">{err}</div>}
      </div>
    </div>
  );
}

/* ── Tab: ประวัติ ── */
function AssessmentsTab({ branches }) {
  const [rows, setRows] = useState([]);
  const [filterBranch, setFilterBranch] = useState('');
  const [loading, setLoading] = useState(true);
  const modeLabel = { sell:'ขาย', buy:'รับซื้อ', trade:'เปลี่ยน' };
  const modeStyle = {
    sell: { background:'rgba(50,215,75,0.12)', color:'var(--up)' },
    buy:  { background:'rgba(255,69,58,0.12)',  color:'var(--down)' },
    trade:{ background:'rgba(245,197,66,0.12)', color:'var(--gold)' },
  };

  useEffect(() => {
    setLoading(true);
    let q = sb.from('assessments')
      .select('*, branches(name), employees(name)')
      .order('created_at', { ascending: false }).limit(500);
    if (filterBranch) q = q.eq('branch_id', filterBranch);
    q.then(({ data }) => { setRows(data || []); setLoading(false); });
  }, [filterBranch]);

  const total = rows.reduce((s, r) => s + Number(r.total || 0), 0);

  return (
    <div className="card" style={{overflowX:'auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexWrap:'wrap',gap:12}}>
        <div>
          <div className="card-title" style={{marginBottom:2}}>ประวัติใบประเมิน ({rows.length} รายการ)</div>
          {rows.length > 0 && (
            <div style={{fontSize:12,color:'var(--text-mute)',fontFamily:'var(--mono)'}}>
              ยอดรวม: <span style={{color:'var(--gold)'}}>{fmtNum(total)}</span> บาท
            </div>
          )}
        </div>
        <div className="f-input" style={{minWidth:180}}>
          <select value={filterBranch} onChange={e=>setFilterBranch(e.target.value)}>
            <option value="">ทุกสาขา</option>
            {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
          </select>
        </div>
      </div>
      {loading ? (
        <div className="spinner">กำลังโหลด...</div>
      ) : rows.length === 0 ? (
        <div style={{color:'var(--text-mute)',fontSize:13,padding:'30px 0',fontFamily:'var(--mono)'}}>ยังไม่มีรายการ</div>
      ) : (
        <table>
          <thead><tr>
            <th>รหัสใบประเมิน</th><th>วัน เวลา</th><th>สาขา</th><th>พนักงาน</th><th>ประเภท</th><th>น้ำหนัก</th><th style={{textAlign:'right'}}>ยอดรวม (บาท)</th>
          </tr></thead>
          <tbody>{rows.map(r => (
            <tr key={r.id}>
              <td className="mono">{r.ref_code}</td>
              <td style={{fontSize:12,color:'var(--text-mute)',fontFamily:'var(--mono)'}}>{thaiDt(r.created_at)}</td>
              <td style={{color:'var(--text-dim)'}}>{r.branches?.name ?? '—'}</td>
              <td style={{color:'var(--text-dim)'}}>{r.employees?.name ?? r.employee_id_card}</td>
              <td>
                <span className="badge" style={modeStyle[r.mode]||{background:'var(--bg-3)',color:'var(--text-mute)'}}>
                  {modeLabel[r.mode]||r.mode}
                </span>
              </td>
              <td style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--text-dim)'}}>{r.weight_baht} บาท</td>
              <td style={{fontFamily:'var(--mono)',textAlign:'right',color:'var(--gold)',fontWeight:600}}>{fmtNum(r.total)}</td>
            </tr>
          ))}</tbody>
        </table>
      )}
    </div>
  );
}

/* ── App ── */
const TABS = ['สาขา', 'พนักงาน', 'สูตรคำนวณ', 'ประวัติ'];

function AdminApp() {
  const [session, setSession] = useState(null);
  const [checking, setChecking] = useState(true);
  const [tab, setTab] = useState(0);
  const [branches, setBranches] = useState([]);

  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => { setSession(session); setChecking(false); });
    const { data: { subscription } } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) return;
    sb.from('branches').select('*').order('created_at').then(({ data }) => data && setBranches(data));
  }, [session, tab]);

  const logout = () => sb.auth.signOut();

  if (checking) return <div className="spinner">กำลังตรวจสอบ...</div>;
  if (!session) return <LoginPage onLogin={() => {}} />;

  return (
    <div className="admin-wrap">
      <header className="admin-header">
        <div className="admin-brand">
          <div className="admin-brand-icon">G</div>
          <div>
            <div className="admin-brand-text">Admin Panel</div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:12,color:'var(--text-mute)',fontFamily:'var(--mono)'}}>{session.user.email}</span>
          <button className="btn-ghost btn-sm" onClick={logout}>ออกจากระบบ</button>
        </div>
      </header>

      <div className="tab-bar">
        {TABS.map((t,i) => (
          <button key={i} className={`tab${tab===i?' active':''}`} onClick={()=>setTab(i)}>{t}</button>
        ))}
      </div>

      <div className="content">
        {tab === 0 && <BranchesTab />}
        {tab === 1 && <EmployeesTab branches={branches} />}
        {tab === 2 && <ConfigsTab branches={branches} />}
        {tab === 3 && <AssessmentsTab branches={branches} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
</script>
</body>
</html>
