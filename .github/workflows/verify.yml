name: Verify Yaowarat Gold
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/yaowarat-pwa-ux]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check manifest and critical app structure
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const index = fs.readFileSync('index.html', 'utf8');
          const admin = fs.readFileSync('admin.html', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));

          for (const [name, html] of [['index.html', index], ['admin.html', admin]]) {
            assert.equal((html.match(/<script\\b/g) || []).length, (html.match(/<\\/script>/g) || []).length, name + ': script tags must balance');
            assert.equal((html.match(/<style\\b/g) || []).length, (html.match(/<\\/style>/g) || []).length, name + ': style tags must balance');
            assert.match(html, /ทองคำเยาวราช/, name + ': expected brand');
          }
          assert.equal(manifest.short_name, 'ทองคำเยาวราช');
          assert.equal(manifest.display, 'standalone');
          assert.match(sw, /SKIP_CACHE_HOSTS/);
          assert.match(sw, /if \\(SKIP_CACHE_HOSTS\\.some/);
          assert.match(sw, /yaowarat-gold-v2/);
          for (const feature of ["from('assessments')", "from('branches')", "from('employees')", "createClient"]) {
            assert.ok(index.includes(feature), 'index.html missing critical integration: ' + feature);
          }
          for (const feature of ["from('branches')", "from('employees')", "from('assessments')", "from('branch_configs')"]) {
            assert.ok(admin.includes(feature), 'admin.html missing critical integration: ' + feature);
          }
          console.log('Static checks passed. Runtime calculation and live Supabase/API tests still require staging-device verification.');
          NODE
