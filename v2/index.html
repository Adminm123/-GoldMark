<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8f1724"><title>GoldMark V2 — ทองคำเยาวราช</title>
<style>
:root{--red:#8f1724;--red2:#67101a;--gold:#b99755;--ink:#24211f;--muted:#77716c;--line:#e9e4dd;--bg:#f7f5f1;--white:#fff;--green:#176b4d;--shadow:0 12px 34px #30241a0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Noto Sans Thai",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1060px;margin:auto;min-height:100vh;padding-bottom:90px}.top{background:var(--red);color:white;padding:18px 20px 20px;border-bottom:3px solid var(--gold)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:19px;font-weight:800;letter-spacing:.2px}.eyebrow{font-size:11px;letter-spacing:1.8px;color:#e9d9b4}.branch{font-size:12px;color:#f0e6e3;border:1px solid #ffffff45;border-radius:99px;padding:6px 10px}.top h1{font-size:25px;margin:18px 0 4px}.top p{margin:0;color:#f1dfe0;font-size:13px}.tabs{display:flex;gap:6px;padding:12px 16px;background:white;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;background:transparent;padding:10px 13px;border-radius:10px;color:var(--muted);white-space:nowrap}.tab.active{background:#f5e9e8;color:var(--red);font-weight:750}.content{padding:18px 16px;max-width:760px;margin:auto}.stepmeta{font-size:12px;color:var(--muted);margin-bottom:8px}.heading{font-size:22px;margin:0 0 5px}.sub{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.6}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:13px;box-shadow:var(--shadow)}.label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field{width:100%;border:1px solid #dcd5cb;border-radius:11px;background:white;padding:12px;color:var(--ink);outline:none}.field:focus{border-color:var(--gold);box-shadow:0 0 0 3px #b9975522}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{border:1px solid var(--line);background:white;border-radius:14px;padding:16px;text-align:left;min-height:88px}.choice strong{display:block;font-size:15px;margin-bottom:5px}.choice span{font-size:12px;color:var(--muted)}.choice.selected{border:1.5px solid var(--red);background:#fff8f7;box-shadow:0 0 0 2px #8f17240c}.money{font-size:29px;font-weight:850;letter-spacing:-.6px}.money small{font-size:13px;font-weight:500;color:var(--muted)}.statrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.statrow:last-child{border-bottom:0}.total{background:#fbf5e9;border-color:#e6d4ad}.total .money{color:var(--red)}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:750}.primary{background:var(--red);color:white}.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.danger{color:#a32630;background:#fff3f2;border:1px solid #f0d5d4}.btnrow{display:flex;gap:9px;flex-wrap:wrap}.btnrow .btn{flex:1}.sticky{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}.stickyinner{max-width:728px;margin:auto;display:flex;gap:10px}.sticky .btn{flex:1}.item{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px}.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.itemtitle{font-weight:750}.tiny{font-size:12px;color:var(--muted)}.pill{font-size:11px;padding:4px 8px;background:#f1ece4;border-radius:99px}.notice{font-size:12px;color:var(--muted);line-height:1.6}.success{color:var(--green);font-weight:750}.hidden{display:none!important}.customer-overlay{position:fixed;inset:0;z-index:9999;background:#f7f5f1;color:#24211f;overflow:auto;padding:18px 14px calc(24px + env(safe-area-inset-bottom));font-size:17px}.customer-wrap{max-width:760px;margin:0 auto}.customer-head{text-align:center;background:#8f1724;color:#fff;border-bottom:4px solid #b99755;border-radius:16px;padding:20px 14px;margin-bottom:14px}.customer-head .brandline{font-size:13px;letter-spacing:1px;color:#f0dfb8}.customer-head h2{font-size:25px;margin:8px 0 0}.customer-total{background:#fff8e9;border:1px solid #e6d4ad;border-radius:16px;padding:18px;margin-bottom:14px;text-align:center}.customer-total .amount{font-size:clamp(32px,9vw,48px);font-weight:900;color:#8f1724;line-height:1.3}.customer-item{background:#fff;border:1px solid #e9e4dd;border-radius:14px;padding:15px;margin-bottom:10px}.customer-item h3{font-size:18px;margin:0 0 10px}.customer-row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid #eee8e0;font-size:15px}.customer-row:last-child{border-bottom:0}.customer-row strong{text-align:right}.customer-note{text-align:center;color:#77716c;font-size:12px;margin:14px 0}.customer-exit{width:100%;max-width:420px;display:block;margin:16px auto 0;background:#8f1724;color:#fff;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px}@media print{@page{size:80mm auto;margin:4mm}body{background:#fff!important}.app,.sticky,.foot{display:none!important}#customerOverlay{position:static!important;display:block!important;overflow:visible!important;padding:0!important;background:#fff!important;color:#000!important;font-size:12px!important}.customer-wrap{max-width:none!important;width:100%!important}.customer-head{background:#fff!important;color:#000!important;border:0!important;border-bottom:1px dashed #000!important;border-radius:0!important;padding:0 0 8px!important;margin-bottom:8px!important}.customer-head .brandline{color:#000!important}.customer-head h2{font-size:16px!important}.customer-total,.customer-item{background:#fff!important;border:0!important;border-bottom:1px dashed #000!important;border-radius:0!important;padding:7px 0!important;margin:0!important}.customer-total .amount{font-size:25px!important;color:#000!important}.customer-item h3{font-size:13px!important}.customer-row{font-size:11px!important;padding:4px 0!important;border-color:#ddd!important}.customer-note{font-size:10px!important;color:#000!important}.customer-exit{display:none!important}}.foot{text-align:center;color:#938b81;font-size:11px;padding:15px}@media(min-width:720px){.top{padding:23px 30px}.content{padding:26px 20px}.top h1{font-size:29px}.grid{gap:14px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.money{font-size:25px}.top h1{font-size:22px}}
</style></head><body><div class="app">
<header class="top"><div class="toprow"><div><div class="eyebrow">GOLDMARK · V2 CONCEPT</div><div class="brand">ทองคำเยาวราช</div></div><span class="branch">ต้นแบบระบบใหม่</span></div><h1>ประเมินราคาทอง</h1><p>ชัดเจนทุกขั้นตอน · รวมหลายรายการได้ในครั้งเดียว</p></header>
<nav class="tabs"><button class="tab active" data-page="estimate">ประเมินราคา</button><button class="tab" data-page="history">รายการประเมิน</button><button class="tab" data-page="settings">ตั้งค่าทดลอง</button></nav>
<main class="content" id="main"></main><div class="foot">GoldMark V2 · ต้นแบบทดสอบเท่านั้น · ยังไม่บันทึกลงฐานข้อมูล</div></div>
<div class="sticky hidden" id="stickyBar"><div class="stickyinner"><button class="btn secondary" id="back">ย้อนกลับ</button></div></div>
<script>
const state={page:'estimate',step:'menu',action:'buy',gold:'jewelry',weight:'1',labor:'0',discount:'0',sell:70000,buy:69000,deduct:5,old:[],fresh:[],history:[],compare:false,compareWeight:'1',depositRate:1.25};
const fmt=n=>Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const baht=n=>'฿'+fmt(n);
const weightName=w=>({0.25:'1 สลึง',0.5:'2 สลึง',0.75:'3 สลึง',1:'1 บาท',2:'2 บาท',4:'4 บาท'}[Number(w)]||w+' บาท');
function oldValue(x){const w=Number(x.weight||0),gpb=x.gold==='jewelry'?15.16:15.244,standard=w*gpb,actual=Number(x.grams||standard),shortfall=Math.max(0,standard-actual),deductGrams=x.gold==='jewelry'&&shortfall>0.1?shortfall-0.1:0,netGrams=Math.max(0,actual-deductGrams),netWeight=netGrams/gpb;return {amount:netWeight*state.buy*(1-state.deduct/100),standard,actual,shortfall,deductGrams,netGrams,netWeight,rateDiscount:netWeight*state.buy*state.deduct/100}}
function newValue(x){return Math.max(0,Number(x.weight||0)*state.sell+Number(x.labor||0)-Number(x.discount||0))}
function sumOld(){return state.old.reduce((s,x)=>s+oldValue(x).amount,0)}
function totalOldWeight(){return state.old.reduce((s,x)=>s+oldValue(x).netWeight,0)}
function totalOldGrams(){return state.old.reduce((s,x)=>s+oldValue(x).netGrams,0)}
function sumNew(){return state.fresh.reduce((s,x)=>s+newValue(x),0)}
function net(){return sumNew()-sumOld()}
function go(step){state.step=step;render()}
function header(title,desc){return '<h2 class="heading">'+title+'</h2><p class="sub">'+desc+'</p>'}
function typeCards(){return '<div class="grid">'+[['buy','ซื้อ','ร้านรับซื้อทองจากลูกค้า'],['sell','ขาย','ร้านขายทองให้ลูกค้า'],['exchange','แลกเปลี่ยน','นำทองเก่ามาแลกทองใหม่'],['deposit','ขายฝาก','คำนวณเงินต้นและดอกเบี้ยขายฝาก']].map(x=>'<button class="choice" data-action="'+x[0]+'"><strong>'+x[1]+'</strong><span>'+x[2]+'</span></button>').join('')+'</div>'}
function render(){const el=document.getElementById('main');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));document.getElementById('stickyBar').classList.toggle('hidden',state.page!=='estimate'||state.step==='menu');
if(state.page==='history'){el.innerHTML=header('รายการประเมิน','ประวัติทดลองในหน้านี้เท่านั้น ยังไม่เชื่อมฐานข้อมูลจริง')+(state.history.length?state.history.map((x,i)=>'<div class="card"><b>รายการ #'+(state.history.length-i)+'</b><div class="statrow"><span>ประเภท</span><b>'+x.action+'</b></div><div class="statrow"><span>ยอดสุทธิ</span><b>'+x.result+'</b></div></div>').join(''):'<div class="card notice">ยังไม่มีรายการประเมินทดลอง</div>');return}
if(state.page==='settings'){el.innerHTML=header('ตั้งค่าทดลอง','ราคาเหล่านี้ใช้จำลองหน้าจอเท่านั้น ไม่กระทบราคากลางหรือฐานข้อมูลจริง')+'<div class="card"><label class="label">ราคาขายทองต่อบาท</label><input class="field" id="sell" type="number" value="'+state.sell+'"><label class="label" style="margin-top:12px">ราคารับซื้อทองต่อบาท</label><input class="field" id="buy" type="number" value="'+state.buy+'"><label class="label" style="margin-top:12px">ส่วนลดจากราคารับซื้อ (%)</label><input class="field" id="deduct" type="number" value="'+state.deduct+'"><button class="btn primary" id="saveSettings" style="width:100%;margin-top:15px">บันทึกค่าทดลอง</button></div>';document.getElementById('saveSettings').onclick=()=>{state.sell=+document.getElementById('sell').value||0;state.buy=+document.getElementById('buy').value||0;state.deduct=+document.getElementById('deduct').value||0;render()};return}
if(state.step==='menu'){el.innerHTML='<div class="stepmeta">เมนูหลัก</div>'+header('เลือกประเภทธุรกรรม','แตะหนึ่งครั้งเพื่อไปขั้นตอนถัดไป')+typeCards()+'<div class="card"><div class="label">ราคาทดลอง (ไม่ใช่ราคาปัจจุบัน)</div><div class="statrow"><span>ขายทองใหม่</span><b>'+baht(state.sell)+'/บาท</b></div><div class="statrow"><span>รับซื้อทองเก่า</span><b>'+baht(state.buy)+'/บาท</b></div></div>';bindCommon();return}
if(state.step==='details'){let label={buy:'ซื้อทองใหม่',sell:'ขายทองเก่า',exchange:'แลกเปลี่ยนทอง',deposit:'ขายฝากทอง'}[state.action];el.innerHTML='<div class="stepmeta">ขั้นตอน 1 · '+label+'</div>'+header('กรอกรายการทอง','เลือกประเภทและน้ำหนัก แล้วระบบจะแสดงยอดทันที')+'<div class="card"><label class="label">ประเภททอง</label><div class="grid"><button class="choice '+(state.gold==='jewelry'?'selected':'')+'" data-gold="jewelry"><strong>ทองรูปพรรณ</strong><span>เครื่องประดับทอง</span></button><button class="choice '+(state.gold==='bar'?'selected':'')+'" data-gold="bar"><strong>ทองคำแท่ง</strong><span>ทองแท่ง</span></button></div><label class="label" style="margin-top:14px">น้ำหนัก (บาททองคำ)</label><select id="weight" class="field">'+[['0.25','1 สลึง'],['0.5','2 สลึง'],['0.75','3 สลึง'],['1','1 บาท'],['2','2 บาท'],['3','3 บาท'],['4','4 บาท'],['5','5 บาท'],['10','10 บาท']].map(x=>'<option value="'+x[0]+'" '+(+state.weight===+x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select>'+(state.action==='buy'&&state.gold==='jewelry'?'<label class="label" style="margin-top:13px">น้ำหนักชั่งจริง (กรัม)</label><input class="field" id="actualGrams" type="number" min="0" step=".01" placeholder="ไม่กรอก = น้ำหนักมาตรฐาน"><p class="notice">มาตรฐาน 15.16 กรัมต่อบาท ขาดได้ 0.1 กรัม หากขาดเกินจะหักเฉพาะส่วนที่เกิน</p>':'')+(state.action==='sell'||state.action==='exchange'?'<label class="label" style="margin-top:13px">ค่ากำเหน็จ (บาท)</label><input class="field" id="labor" type="number" min="0" value="'+state.labor+'"><label class="label" style="margin-top:13px">ส่วนลด (บาท)</label><input class="field" id="discount" type="number" min="0" value="'+state.discount+'">':'')+(state.action==='deposit'?'<label class="label" style="margin-top:13px">เงินต้นที่ต้องการ (บาท)</label><input class="field" id="principal" type="number" min="0" value="'+(state.principal||'')+'" placeholder="กรอกเงินต้น"> <label class="label" style="margin-top:13px">ดอกเบี้ยต่อเดือน (%)</label><input class="field" id="rate" type="number" min="0" step=".01" value="'+(state.rate||state.depositRate)+'">':'')+'<button class="btn primary" id="addItem" style="width:100%;margin-top:16px">เพิ่มรายการและคำนวณ</button></div>'+(state.old.length||state.fresh.length?listItems():'');bindCommon();document.getElementById('weight').onchange=e=>state.weight=e.target.value;const lab=document.getElementById('labor');if(lab)lab.oninput=e=>state.labor=e.target.value;const dis=document.getElementById('discount');if(dis)dis.oninput=e=>state.discount=e.target.value;document.getElementById('addItem').onclick=()=>{let x={gold:state.gold,weight:+state.weight};const gi=document.getElementById('actualGrams');if(gi&&gi.value!==''){x.grams=+gi.value;if(x.grams<=0){alert('กรุณากรอกน้ำหนักจริงให้มากกว่า 0 กรัม');return}}if(state.action==='sell'||state.action==='exchange')state.fresh.push({...x,labor:+state.labor||0,discount:+state.discount||0});if(state.action==='buy'||state.action==='exchange')state.old.push(x);if(state.action==='deposit'){state.principal=+document.getElementById('principal').value||0;state.rate=+document.getElementById('rate').value||0;state.depositItem=x;if(!state.principal){alert('กรุณากรอกเงินต้นที่ต้องการ');return}}state.step='result';if(state.action!=='deposit'){state.weight='1';state.labor='0';state.discount='0'}render()};return}
if(state.step==='result'){let body='';if(state.action==='deposit'){let p=state.principal,interest=p*(state.rate||0)/100;body='<div class="card total"><div class="stepmeta">ผลคำนวณขายฝากทดลอง</div><div class="statrow"><span>เงินต้น</span><b>'+baht(p)+'</b></div><div class="statrow"><span>ดอกเบี้ยต่อเดือน</span><b>'+baht(interest)+'</b></div><div class="money">'+baht(p+interest)+'</div><strong>ยอดไถ่ถอนตัวอย่างหลัง 1 เดือน</strong></div>'}else{body='<div class="card total"><div class="stepmeta">ผลคำนวณ</div>'+(state.action==='buy'?'<div class="statrow"><span>น้ำหนักสุทธิรวม</span><b>'+fmt(totalOldGrams())+' กรัม · '+fmt(totalOldWeight())+' บาททองคำ</b></div>':'')+'<div class="money">'+baht(Math.abs(state.action==='buy'?sumOld():state.action==='sell'?sumNew():net()))+'</div><strong>'+(state.action==='buy'?'ร้านจ่ายให้ลูกค้า':state.action==='sell'?'ลูกค้าจ่ายให้ร้าน':net()>0?'ลูกค้าจ่ายเพิ่มให้ร้าน':net()<0?'ร้านจ่ายคืนลูกค้า':'ยอดเท่ากันพอดี')+'</strong></div>'+listItems();if(state.action==='buy')body+='<div class="card"><button class="btn primary" id="customerView" style="width:100%">แสดงผลประเมินให้ลูกค้า</button><button class="btn secondary" id="addAnother" style="width:100%;margin-top:9px">+ เพิ่มรายการทอง</button><p class="notice" style="margin:9px 0 0">แสดงรายละเอียดรับซื้อให้ลูกค้าดู โดยซ่อนปุ่มจัดการของพนักงาน</p></div>';}
el.innerHTML='<div class="stepmeta">ขั้นตอน 2 · สรุป</div>'+header('สรุปราคา','ตรวจสอบยอดก่อนเริ่มรายการใหม่')+body+'<button class="btn primary" id="finish" style="width:100%;margin-top:10px">กลับ</button>';document.getElementById('finish').onclick=()=>{state.history.unshift({action:{buy:'ซื้อ',sell:'ขาย',exchange:'แลกเปลี่ยน',deposit:'ขายฝาก'}[state.action],result:state.action==='buy'?baht(sumOld()):state.action==='sell'?baht(sumNew()):state.action==='exchange'?((net()>0?'ลูกค้าจ่ายเพิ่ม ':net()<0?'ร้านคืนเงิน ':'ยอดเท่ากัน ')+baht(Math.abs(net()))):baht(state.principal+state.principal*(state.rate||0)/100)});reset();render()};const customerView=document.getElementById('customerView');if(customerView)customerView.onclick=showCustomerView;const addAnother=document.getElementById('addAnother');if(addAnother)addAnother.onclick=()=>{state.step='details';state.weight='1';state.compare=false;render()};return}
}
function showCustomerView(){
 const prior=document.getElementById('customerOverlay');if(prior)prior.remove();
 const overlay=document.createElement('section');overlay.id='customerOverlay';overlay.className='customer-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','ราคาประเมินรับซื้อทอง');
 const items=state.old.map((x,i)=>{
  const c=oldValue(x),standard=Number(x.weight||0)*15.20,tolerance=Number(x.weight||0)*0.04,rawShortfall=Math.max(0,standard-c.actual),missing=Math.max(0,rawShortfall-tolerance),missingValue=standard>0?missing/standard*state.buy*(1-state.deduct/100):0;
  return '<article class="customer-item"><h3>'+(x.gold==='bar'?'ทองคำแท่ง':'ทองรูปพรรณ')+' · '+weightName(x.weight)+'</h3><div class="customer-row"><span>น้ำหนักชั่งจริง</span><strong>'+fmt(c.actual)+' กรัม</strong></div><div class="customer-row"><span>น้ำหนักขาดเกินเกณฑ์</span><strong>'+fmt(missing)+' กรัม</strong></div><div class="customer-row"><span>มูลค่าส่วนต่างเกินเกณฑ์</span><strong>'+baht(missingValue)+'</strong></div></article>';
 }).join('');
 overlay.innerHTML='<div class="customer-wrap"><header class="customer-head"><div class="brandline">ทองคำเยาวราช · GOLDMARK</div><h2>ราคาประเมินรับซื้อทองเก่า</h2></header><section class="customer-total"><div>ยอดรับซื้อโดยประมาณ</div><div class="amount">'+baht(sumOld())+'</div></section>'+items+'<p class="customer-note">ใช้เกณฑ์ 15.20 กรัมต่อบาท และยอมรับส่วนต่างได้ 0.04 กรัมต่อบาท (เช่น 15.16 กรัมถือว่าเต็ม) หลังหักส่วนลดรับซื้อ '+fmt(state.deduct)+'% แล้ว</p></div>';
 document.body.appendChild(overlay);document.body.style.overflow='hidden';
 const close=()=>{overlay.remove();document.body.style.overflow='';if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});};
 const backToItems=document.createElement('button');backToItems.className='customer-exit';backToItems.style.background='#ffffff';backToItems.style.color='#24211f';backToItems.style.border='1px solid #e9e4dd';backToItems.textContent='กลับไปแก้ไขรายการ';overlay.querySelector('.customer-wrap').appendChild(backToItems);
 backToItems.onclick=()=>{close();state.page='estimate';state.step='result';render();};
 const decline=document.createElement('button');decline.className='customer-exit';decline.textContent='ยกเลิกการประเมิน';overlay.querySelector('.customer-wrap').appendChild(decline);
 decline.onclick=()=>{close();reset();state.page='estimate';render();};
 const confirm=document.createElement('button');confirm.className='customer-exit';confirm.style.background='#176b4d';confirm.textContent='ยืนยันการขาย';overlay.querySelector('.customer-wrap').appendChild(confirm);
 confirm.onclick=()=>{
  state.history.unshift({action:'รับซื้อทองเก่า · ยืนยันใบประเมิน',result:baht(sumOld())});
  overlay.querySelector('.customer-wrap').insertAdjacentHTML('afterbegin','<p class="customer-note">ใบประเมินรับซื้อทองเก่า · ยืนยันแล้ว · '+new Date().toLocaleString('th-TH')+'</p>');
  overlay.querySelector('.customer-wrap').insertAdjacentHTML('beforeend','<p class="customer-note">เอกสารใบประเมินราคา ไม่ใช่หลักฐานการรับชำระเงิน</p><button class="customer-exit" id="printAssessment">พิมพ์ใบประเมิน</button><button class="customer-exit" id="homeAssessment">กลับหน้าแรก</button>');
  document.getElementById('printAssessment').onclick=()=>window.print();
  document.getElementById('homeAssessment').onclick=()=>{close();reset();state.page='estimate';render();};
  confirm.remove();decline.remove();backToItems.remove();
 };
 overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
 const esc=e=>{if(e.key==='Escape'){close();document.removeEventListener('keydown',esc)}};
 document.addEventListener('keydown',esc);
 if(overlay.requestFullscreen)overlay.requestFullscreen().catch(()=>{});
}
function listItems(){let h='';if(state.old.length)h+='<div class="card"><b>ทองเก่า ('+state.old.length+')</b>'+state.old.map((x,i)=>{const c=oldValue(x);return '<div class="item"><div class="itemtop"><span>ชิ้นที่ '+(i+1)+' · '+(x.gold==='bar'?'ทองคำแท่ง':'ทองรูปพรรณ')+' · '+weightName(x.weight)+'</span><b>'+baht(c.amount)+'</b></div><div class="tiny">มาตรฐาน '+fmt(c.standard)+' กรัม · ชั่งจริง '+fmt(c.actual)+' กรัม · ขาด '+fmt(c.shortfall)+' กรัม</div><div class="tiny">หักน้ำหนัก '+fmt(c.deductGrams)+' กรัม · สุทธิ '+fmt(c.netGrams)+' กรัม ('+fmt(c.netWeight)+' บาททองคำ)</div><div class="tiny">ส่วนลดราคา '+state.deduct+'% = '+baht(c.rateDiscount)+'</div><button class="btn danger" data-remove="old" data-index="'+i+'" style="margin-top:8px;padding:7px 10px">ลบ</button></div>';}).join('')+'</div>';if(state.fresh.length)h+='<div class="card"><b>ทองใหม่ ('+state.fresh.length+')</b>'+state.fresh.map((x,i)=>'<div class="item"><div class="itemtop"><span>'+(x.gold==='bar'?'ทองคำแท่ง':'ทองรูปพรรณ')+' · '+weightName(x.weight)+'</span><b>'+baht(newValue(x))+'</b></div><div class="tiny">กำเหน็จ '+baht(x.labor)+' · ส่วนลด '+baht(x.discount)+'</div><button class="btn danger" data-remove="fresh" data-index="'+i+'" style="margin-top:8px;padding:7px 10px">ลบ</button></div>').join('')+'</div>';return h}
function comparePanel(){let w=+state.compareWeight||1;let amount=state.action==='sell'?w*state.sell+(+state.labor||0)-(+state.discount||0):w*state.buy*(1-state.deduct/100);return '<div class="card"><label class="label">เลือกน้ำหนักที่ต้องการเปรียบเทียบ</label><select class="field" id="compareWeight">'+[['0.25','1 สลึง'],['0.5','2 สลึง'],['0.75','3 สลึง'],['1','1 บาท'],['2','2 บาท'],['3','3 บาท'],['4','4 บาท'],['5','5 บาท'],['10','10 บาท']].map(x=>'<option value="'+x[0]+'" '+(+x[0]===w?'selected':'')+'>'+x[1]+'</option>').join('')+'</select><div class="statrow"><span>'+ (state.action==='sell'?'ราคาขายทองใหม่':'ราคารับซื้อทองเก่า')+'</span><b>'+baht(amount)+'</b></div><p class="notice">คำนวณจากราคาทดลองที่ตั้งไว้ และค่ากำเหน็จ/ส่วนลดที่กรอกในรายการล่าสุด</p></div>'}
function bindCompare(){const c=document.getElementById('compareWeight');if(c)c.onchange=e=>{state.compareWeight=e.target.value;render()}}
function bindCommon(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{state.action=b.dataset.action;state.old=[];state.fresh=[];state.compare=false;state.step='details';render()});document.querySelectorAll('[data-gold]').forEach(b=>b.onclick=()=>{state.gold=b.dataset.gold;render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state[b.dataset.remove].splice(+b.dataset.index,1);render()})}
function reset(){state.step='menu';state.action='buy';state.gold='jewelry';state.weight='1';state.labor='0';state.discount='0';state.old=[];state.fresh=[];state.compare=false;state.principal=0}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});
document.getElementById('back').onclick=()=>{if(state.step==='result')state.step='details';else state.step='menu';render()};
render();
</script></body></html>
