<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8f1724"><title>GoldMark V2 — ทองคำเยาวราช</title>
<style>
:root{--red:#8f1724;--red2:#67101a;--gold:#b99755;--ink:#24211f;--muted:#77716c;--line:#e9e4dd;--bg:#f7f5f1;--white:#fff;--green:#176b4d;--shadow:0 12px 34px #30241a0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Noto Sans Thai",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1060px;margin:auto;min-height:100vh;padding-bottom:90px}.top{background:var(--red);color:white;padding:18px 20px 20px;border-bottom:3px solid var(--gold)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:19px;font-weight:800;letter-spacing:.2px}.eyebrow{font-size:11px;letter-spacing:1.8px;color:#e9d9b4}.branch{font-size:12px;color:#f0e6e3;border:1px solid #ffffff45;border-radius:99px;padding:6px 10px}.top h1{font-size:25px;margin:18px 0 4px}.top p{margin:0;color:#f1dfe0;font-size:13px}.tabs{display:flex;gap:6px;padding:12px 16px;background:white;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;background:transparent;padding:10px 13px;border-radius:10px;color:var(--muted);white-space:nowrap}.tab.active{background:#f5e9e8;color:var(--red);font-weight:750}.content{padding:18px 16px;max-width:760px;margin:auto}.stepmeta{font-size:12px;color:var(--muted);margin-bottom:8px}.heading{font-size:22px;margin:0 0 5px}.sub{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.6}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:13px;box-shadow:var(--shadow)}.label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field{width:100%;border:1px solid #dcd5cb;border-radius:11px;background:white;padding:12px;color:var(--ink);outline:none}.field:focus{border-color:var(--gold);box-shadow:0 0 0 3px #b9975522}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{border:1px solid var(--line);background:white;border-radius:14px;padding:16px;text-align:left;min-height:88px}.choice strong{display:block;font-size:15px;margin-bottom:5px}.choice span{font-size:12px;color:var(--muted)}.choice.selected{border:1.5px solid var(--red);background:#fff8f7;box-shadow:0 0 0 2px #8f17240c}.money{font-size:29px;font-weight:850;letter-spacing:-.6px}.money small{font-size:13px;font-weight:500;color:var(--muted)}.statrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.statrow:last-child{border-bottom:0}.total{background:#fbf5e9;border-color:#e6d4ad}.total .money{color:var(--red)}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:750}.primary{background:var(--red);color:white}.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.danger{color:#a32630;background:#fff3f2;border:1px solid #f0d5d4}.btnrow{display:flex;gap:9px;flex-wrap:wrap}.btnrow .btn{flex:1}.sticky{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}.stickyinner{max-width:728px;margin:auto;display:flex;gap:10px}.sticky .btn{flex:1}.item{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px}.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.itemtitle{font-weight:750}.tiny{font-size:12px;color:var(--muted)}.pill{font-size:11px;padding:4px 8px;background:#f1ece4;border-radius:99px}.notice{font-size:12px;color:var(--muted);line-height:1.6}.success{color:var(--green);font-weight:750}.hidden{display:none!important}.foot{text-align:center;color:#938b81;font-size:11px;padding:15px}@media(min-width:720px){.top{padding:23px 30px}.content{padding:26px 20px}.top h1{font-size:29px}.grid{gap:14px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.money{font-size:25px}.top h1{font-size:22px}}
</style></head><body><div class="app">
<header class="top"><div class="toprow"><div><div class="eyebrow">GOLDMARK · V2 CONCEPT</div><div class="brand">ทองคำเยาวราช</div></div><span class="branch">ต้นแบบระบบใหม่</span></div><h1>ประเมินราคาทอง</h1><p>ชัดเจนทุกขั้นตอน · รวมหลายรายการได้ในครั้งเดียว</p></header>
<nav class="tabs"><button class="tab active" data-page="estimate">ประเมินราคา</button><button class="tab" data-page="history">รายการประเมิน</button><button class="tab" data-page="settings">ตั้งค่าทดลอง</button></nav>
<main class="content" id="main"></main><div class="foot">GoldMark V2 · ต้นแบบทดสอบเท่านั้น · ยังไม่บันทึกลงฐานข้อมูล</div></div>
<div class="sticky"><div class="stickyinner"><button class="btn secondary" id="back">ย้อนกลับ</button><button class="btn primary" id="next">เริ่มประเมิน</button></div></div>
<script>
const state={page:'estimate',step:0,action:'trade',gold:'jewelry',weight:'1',labor:'',discount:'0',sell:70000,buy:69000,deduct:2,old:[],fresh:[],history:[],stage:'choose'};
const fmt=n=>Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const baht=n=>'฿'+fmt(n);
function oldValue(x){return Number(x.weight||0)*state.buy*(x.gold==='bar'?1:1-state.deduct/100)}
function newValue(x){return Math.max(0,Number(x.weight||0)*state.sell+Number(x.labor||0)-Number(x.discount||0))}
function net(){return state.fresh.reduce((s,x)=>s+newValue(x),0)-state.old.reduce((s,x)=>s+oldValue(x),0)}
function main(){const el=document.getElementById('main');if(state.page==='history'){el.innerHTML='<div class="stepmeta">ประวัติในเครื่องนี้</div><h2 class="heading">รายการประเมิน</h2><p class="sub">รายการที่ทดลองคำนวณในหน้านี้เท่านั้น ยังไม่ใช่ประวัติจากฐานข้อมูล</p>'+(state.history.length?state.history.map((x,i)=>'<div class="card"><div class="itemtop"><strong>รายการทดลอง #'+(state.history.length-i)+'</strong><span class="pill">'+x.time+'</span></div><div class="statrow"><span>ทองเก่า</span><b>'+baht(x.old)+'</b></div><div class="statrow"><span>ทองใหม่</span><b>'+baht(x.fresh)+'</b></div><div class="statrow"><span>ยอดสุทธิ</span><b>'+ (x.net>=0?'ลูกค้าจ่ายเพิ่ม ':'ร้านจ่ายคืน ')+baht(Math.abs(x.net))+'</b></div></div>').join(''):'<div class="card notice">ยังไม่มีรายการทดลอง กดประเมินราคาและบันทึกผลเพื่อดูตัวอย่างได้</div>');bind();return}
if(state.page==='settings'){el.innerHTML='<div class="stepmeta">ข้อมูลจำลองเท่านั้น</div><h2 class="heading">ตั้งค่าทดลอง</h2><p class="sub">ใช้ทดลองสูตรและหน้าจอ ไม่ได้เปลี่ยนราคากลางหรือค่าจริงในระบบเดิม</p><div class="card"><label class="label">ราคาขายทองต่อบาท (บาท)</label><input class="field" id="sell" type="number" value="'+state.sell+'"><label class="label" style="margin-top:13px">ราคารับซื้อทองต่อบาท (บาท)</label><input class="field" id="buy" type="number" value="'+state.buy+'"><label class="label" style="margin-top:13px">หักเปอร์เซ็นต์ทองรูปพรรณ (%)</label><input class="field" id="deduct" type="number" step=".1" value="'+state.deduct+'"><p class="notice">ค่าที่ใส่มีผลเฉพาะต้นแบบในหน้านี้</p><button class="btn primary" id="saveSettings">ใช้ค่าทดลอง</button></div>';bind();return}
const pages=[
()=>'<div class="stepmeta">ขั้นตอน 1 จาก 4</div><h2 class="heading">วันนี้ต้องการประเมินอะไร?</h2><p class="sub">เลือกประเภทก่อน ระบบจะแสดงเฉพาะขั้นตอนที่เกี่ยวข้อง</p><div class="grid"><button class="choice '+(state.action==='old'?'selected':'')+'" data-action="old"><strong>ขายทองเก่าให้ร้าน</strong><span>ประเมินยอดเงินที่ร้านรับซื้อ</span></button><button class="choice '+(state.action==='new'?'selected':'')+'" data-action="new"><strong>ซื้อทองใหม่จากร้าน</strong><span>คำนวณราคาทองและค่ากำเหน็จ</span></button><button class="choice '+(state.action==='trade'?'selected':'')+'" data-action="trade" style="grid-column:1/-1"><strong>แลกทอง / เปรียบเทียบหลายรายการ</strong><span>เพิ่มทองเก่าและทองใหม่หลายชิ้น แล้วคำนวณยอดสุทธิ</span></button></div><div class="card"><label class="label">ราคาทองขายอ้างอิง (บาทละ)</label><div class="money">'+baht(state.sell)+'</div><div class="statrow"><span>ราคารับซื้ออ้างอิง</span><b>'+baht(state.buy)+'</b></div><p class="notice">ราคาตัวอย่างสำหรับทดสอบเท่านั้น ไม่ใช่ราคาทองปัจจุบัน</p></div>',
()=>'<div class="stepmeta">ขั้นตอน 2 จาก 4</div><h2 class="heading">เพิ่มรายการทอง</h2><p class="sub">เลือกประเภทและน้ำหนัก จากนั้นเพิ่มรายการได้มากกว่าหนึ่งชิ้น</p><div class="card"><label class="label">ประเภททอง</label><div class="grid"><button class="choice '+(state.gold==='jewelry'?'selected':'')+'" data-gold="jewelry"><strong>ทองรูปพรรณ</strong><span>ใช้เงื่อนไขหักรับซื้อทดลอง</span></button><button class="choice '+(state.gold==='bar'?'selected':'')+'" data-gold="bar"><strong>ทองคำแท่ง</strong><span>ใช้ราคารับซื้ออ้างอิง</span></button></div><label class="label" style="margin-top:15px">น้ำหนัก (บาททองคำ)</label><input class="field" id="weight" type="number" min=".01" step=".01" value="'+state.weight+'"><div class="grid" style="margin-top:10px"><div><label class="label">ค่ากำเหน็จ (บาท)</label><input class="field" id="labor" type="number" min="0" value="'+state.labor+' " placeholder="0"></div><div><label class="label">ส่วนลด (บาท)</label><input class="field" id="discount" type="number" min="0" value="'+state.discount+'"></div></div><button class="btn primary" style="width:100%;margin-top:14px" id="addItem">+ เพิ่มรายการตามประเภทที่เลือก</button></div>'+listItems()+'<div class="notice">ค่ากำเหน็จและส่วนลดใช้กับรายการทองใหม่เท่านั้น</div>',
()=>'<div class="stepmeta">ขั้นตอน 3 จาก 4</div><h2 class="heading">ตรวจสอบยอดรวม</h2><p class="sub">ตรวจรายการทองเก่าและทองใหม่ทั้งหมดก่อนดูยอดสุทธิ</p>'+listItems()+'<div class="card"><div class="statrow"><span>รวมมูลค่าทองเก่า</span><b>'+baht(state.old.reduce((s,x)=>s+oldValue(x),0))+'</b></div><div class="statrow"><span>รวมราคาทองใหม่หลังค่ากำเหน็จ/ส่วนลด</span><b>'+baht(state.fresh.reduce((s,x)=>s+newValue(x),0))+'</b></div></div>',
()=>'<div class="stepmeta">ขั้นตอน 4 จาก 4</div><h2 class="heading">สรุปผลการประเมิน</h2><p class="sub">ผลคำนวณจำลองจากรายการที่เพิ่มไว้</p><div class="card total"><div class="stepmeta">ยอดสุทธิ</div><div class="money">'+baht(Math.abs(net()))+'</div><strong>'+(net()>0?'ลูกค้าต้องจ่ายเพิ่มให้ร้าน':net()<0?'ร้านต้องจ่ายเงินคืนลูกค้า':'ยอดเท่ากันพอดี')+'</strong></div><div class="card"><div class="statrow"><span>รวมทองเก่า ('+state.old.length+' รายการ)</span><b>'+baht(state.old.reduce((s,x)=>s+oldValue(x),0))+'</b></div><div class="statrow"><span>รวมทองใหม่ ('+state.fresh.length+' รายการ)</span><b>'+baht(state.fresh.reduce((s,x)=>s+newValue(x),0))+'</b></div><p class="notice">นี่เป็นผลประเมินทดลอง ไม่ใช่ใบเสร็จหรือการยืนยันธุรกรรม</p><button class="btn primary" id="saveEstimate" style="width:100%">บันทึกตัวอย่างในหน้านี้</button></div>'
];el.innerHTML=pages[state.step]();bind()}
function listItems(){let h='';if(state.old.length)h+='<div class="card"><strong>ทองเก่า · '+state.old.length+' รายการ</strong>'+state.old.map((x,i)=>'<div class="item"><div class="itemtop"><div><div class="itemtitle">'+(x.gold==='bar'?'ทองคำแท่ง':'ทองรูปพรรณ')+' '+x.weight+' บาท</div><div class="tiny">มูลค่ารับซื้อโดยประมาณ</div></div><b>'+baht(oldValue(x))+'</b></div><button class="btn danger" style="margin-top:9px;padding:7px 10px" data-remove="old" data-index="'+i+'">ลบรายการ</button></div>').join('')+'</div>';if(state.fresh.length)h+='<div class="card"><strong>ทองใหม่ · '+state.fresh.length+' รายการ</strong>'+state.fresh.map((x,i)=>'<div class="item"><div class="itemtop"><div><div class="itemtitle">'+(x.gold==='bar'?'ทองคำแท่ง':'ทองรูปพรรณ')+' '+x.weight+' บาท</div><div class="tiny">ค่ากำเหน็จ '+baht(x.labor)+' · ส่วนลด '+baht(x.discount)+'</div></div><b>'+baht(newValue(x))+'</b></div><button class="btn danger" style="margin-top:9px;padding:7px 10px" data-remove="fresh" data-index="'+i+'">ลบรายการ</button></div>').join('')+'</div>';if(!h)h='<div class="card notice">ยังไม่มีรายการ กด “เพิ่มรายการ” เพื่อเริ่มคำนวณ</div>';return h}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{state.action=b.dataset.action;state.step=0;main()});document.querySelectorAll('[data-gold]').forEach(b=>b.onclick=()=>{state.gold=b.dataset.gold;main()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state[b.dataset.remove].splice(Number(b.dataset.index),1);main()});const w=document.getElementById('weight');if(w)w.oninput=()=>state.weight=w.value;const l=document.getElementById('labor');if(l)l.oninput=()=>state.labor=l.value;const d=document.getElementById('discount');if(d)d.oninput=()=>state.discount=d.value;const add=document.getElementById('addItem');if(add)add.onclick=()=>{const weight=Number(state.weight);if(!weight||weight<=0){alert('กรุณาใส่น้ำหนักให้ถูกต้อง');return}if(state.action!=='new')state.old.push({gold:state.gold,weight});if(state.action!=='old')state.fresh.push({gold:state.gold,weight,labor:Number(state.labor)||0,discount:Number(state.discount)||0});state.weight='1';state.labor='';state.discount='0';main()};const ss=document.getElementById('saveSettings');if(ss)ss.onclick=()=>{state.sell=Number(document.getElementById('sell').value)||0;state.buy=Number(document.getElementById('buy').value)||0;state.deduct=Number(document.getElementById('deduct').value)||0;main();alert('อัปเดตค่าทดลองแล้ว')};const se=document.getElementById('saveEstimate');if(se)se.onclick=()=>{state.history.unshift({old:state.old.reduce((s,x)=>s+oldValue(x),0),fresh:state.fresh.reduce((s,x)=>s+newValue(x),0),net:net(),time:new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})});alert('บันทึกเป็นตัวอย่างในหน้านี้แล้ว');state.page='history';main();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page==='history'))}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));main();document.getElementById('next').textContent=state.page==='estimate'?'ดำเนินการต่อ':'กลับไปประเมิน';document.getElementById('back').classList.toggle('hidden',state.page!=='estimate')});
document.getElementById('back').onclick=()=>{if(state.step>0){state.step--;main()}else{state.old=[];state.fresh=[];state.step=0;main()}};
document.getElementById('next').onclick=()=>{if(state.page!=='estimate'){state.page='estimate';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page==='estimate'));main();document.getElementById('next').textContent='ดำเนินการต่อ';document.getElementById('back').classList.remove('hidden');return}if(state.step<3){if(state.step===1&&!state.old.length&&!state.fresh.length){alert('เพิ่มรายการอย่างน้อย 1 รายการก่อน');return}state.step++;main()}else{state.step=0;state.old=[];state.fresh=[];main()}document.getElementById('next').textContent=state.step===0?'เริ่มประเมิน':state.step===3?'เริ่มรายการใหม่':'ดำเนินการต่อ'};
main();
</script></body></html>
