<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ห้างทอง รัตนกาญจน์ — ระบบคำนวณราคาทอง</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
:root {
  --bg: #0d0814;
  --bg-2: #150f1c;
  --surface: rgba(28, 20, 36, 0.78);
  --surface-2: rgba(36, 26, 44, 0.82);
  --surface-3: rgba(48, 32, 54, 0.85);
  --border: rgba(180, 140, 80, 0.22);
  --border-bright: rgba(220, 180, 110, 0.38);
  --gold: #e6c779;
  --gold-bright: #f8e2a8;
  --gold-soft: #c9a24a;
  --gold-deep: #8b6420;
  --gold-glow: rgba(248, 226, 168, 0.4);
  --crimson: #8b1538;
  --navy: #1a2b6e;
  --text: #fbf3df;
  --text-dim: #e0cea2;
  --text-mute: #a89373;
  --up: #8ed1a6;
  --down: #e09478;
  --serif-th: 'Noto Serif Thai', serif;
  --serif-en: 'Playfair Display', 'Noto Serif Thai', serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--serif-th);
  font-size: 16px;
  line-height: 1.6;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: -10%;
  z-index: -2;
  background:
    radial-gradient(ellipse 55% 45% at 15% 12%, rgba(180,30,60,0.55), transparent 65%),
    radial-gradient(ellipse 60% 50% at 85% 85%, rgba(40,60,200,0.5), transparent 65%),
    radial-gradient(ellipse 45% 35% at 75% 25%, rgba(150,40,110,0.32), transparent 70%),
    radial-gradient(ellipse 50% 40% at 25% 75%, rgba(60,30,150,0.32), transparent 70%),
    linear-gradient(135deg, #1f0a18 0%, #0d0814 45%, #0a0f24 100%);
  animation: ambientShift 22s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 0%, rgba(248,226,168,0.08), transparent 50%),
    radial-gradient(circle 1px at 20% 30%, rgba(248,226,168,0.4) 100%, transparent 0),
    radial-gradient(circle 1px at 80% 60%, rgba(248,226,168,0.3) 100%, transparent 0),
    radial-gradient(circle 1px at 35% 70%, rgba(248,226,168,0.35) 100%, transparent 0),
    radial-gradient(circle 1px at 65% 20%, rgba(248,226,168,0.3) 100%, transparent 0),
    radial-gradient(circle 1px at 90% 40%, rgba(248,226,168,0.25) 100%, transparent 0);
  background-size: 100% 100%, 800px 800px, 800px 800px, 800px 800px, 800px 800px, 800px 800px;
  background-position: 0 0, 0 0, 120px 200px, 400px 80px, 50px 500px, 600px 380px;
  animation: starDrift 60s linear infinite;
}
@keyframes ambientShift {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(-2%,1.5%) scale(1.04); }
  100% { transform: translate(2%,-1%) scale(1.02); }
}
@keyframes starDrift {
  to { background-position: 0 0, 30px 60px, 150px 260px, 430px 140px, 80px 560px, 630px 440px; }
}
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }

/* Header */
.site-header {
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(248,226,168,0.04), transparent), rgba(13,8,20,0.4);
  backdrop-filter: blur(10px);
}
.site-header .inner {
  max-width: 1280px; margin: 0 auto; padding: 36px 32px 30px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
}
.brand { display: flex; align-items: center; gap: 18px; }
.brand-mark {
  width: 60px; height: 60px; border: 1px solid var(--gold);
  position: relative; display: grid; place-items: center;
  background: radial-gradient(circle, rgba(248,226,168,0.25), transparent 70%);
  animation: markGlow 4s ease-in-out infinite;
}
@keyframes markGlow {
  0%,100% { box-shadow: 0 0 0 rgba(248,226,168,0), inset 0 0 0 rgba(248,226,168,0); }
  50%     { box-shadow: 0 0 30px rgba(248,226,168,0.35), inset 0 0 18px rgba(248,226,168,0.18); }
}
.brand-mark::before, .brand-mark::after {
  content: ''; position: absolute; border: 1px solid var(--gold-soft); inset: 4px; pointer-events: none;
}
.brand-mark::after { inset: 8px; opacity: 0.5; }
.brand-mark .glyph {
  font-family: var(--serif-en); font-style: italic; font-weight: 700;
  font-size: 22px; color: var(--gold-bright); z-index: 1; line-height: 1;
}
.brand-text .name-th { font-weight: 700; font-size: 20px; letter-spacing: 0.04em; line-height: 1.1; }
.brand-text .name-en {
  font-family: var(--serif-en); font-style: italic; font-size: 13px;
  color: var(--gold); letter-spacing: 0.15em; margin-top: 4px;
}
.header-meta { text-align: right; font-size: 13px; color: var(--text-dim); }
.header-meta .label { font-size: 11px; color: var(--text-mute); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 2px; }
.header-meta .value { font-family: var(--mono); color: var(--gold-bright); font-size: 15px; letter-spacing: 0.06em; }

/* Page */
.page { max-width: 1280px; margin: 0 auto; padding: 0 32px 80px; }
.page > section { animation: sectionRise 0.7s cubic-bezier(.2,.7,.2,1) backwards; }
.page > section:nth-child(1) { animation-delay: 0.05s; }
.page > section:nth-child(2) { animation-delay: 0.15s; }
.page > section:nth-child(3) { animation-delay: 0.25s; }
.page > section:nth-child(4) { animation-delay: 0.35s; }
@keyframes sectionRise {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Section heading */
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 16px; margin: 64px 0 24px; border-bottom: 1px solid var(--border);
  padding-bottom: 14px; position: relative;
}
.section-head::after {
  content: ''; position: absolute; left: 0; bottom: -1px;
  height: 1px; width: 80px;
  background: linear-gradient(90deg, var(--gold-bright), transparent);
}
.section-head .title { display: flex; align-items: baseline; gap: 16px; }
.section-head .index {
  font-family: var(--serif-en); font-style: italic; font-size: 14px;
  color: var(--gold-bright); letter-spacing: 0.1em; text-shadow: 0 0 12px var(--gold-glow);
}
.section-head h2 { font-weight: 700; font-size: 24px; letter-spacing: 0.04em; color: var(--text); margin: 0; }
.section-head .meta { font-size: 12px; color: var(--text-mute); letter-spacing: 0.06em; font-family: var(--mono); }

/* Prices */
.prices {
  display: grid; grid-template-columns: 1fr; gap: 1px;
  background: var(--border); border: 1px solid var(--border-bright);
  position: relative; overflow: hidden;
  box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(248,226,168,0.06), inset 0 1px 0 rgba(248,226,168,0.08);
  backdrop-filter: blur(10px);
}
.prices::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 30%, rgba(248,226,168,0.08) 50%, transparent 70%);
  background-size: 200% 100%;
  animation: priceShimmer 7s ease-in-out infinite; pointer-events: none; z-index: 1;
}
@keyframes priceShimmer {
  0%,100% { background-position: 200% 0; }
  50%     { background-position: -50% 0; }
}
.price-card {
  background: var(--surface); padding: 44px 48px;
  position: relative; z-index: 2; backdrop-filter: blur(14px);
}
.price-card::before, .price-card::after {
  content: ''; position: absolute; width: 28px; height: 28px;
  border: 1px solid var(--gold-soft); opacity: 0.55; pointer-events: none;
}
.price-card::before { top: 14px; left: 14px; border-right: none; border-bottom: none; }
.price-card::after  { bottom: 14px; right: 14px; border-left: none; border-top: none; }
.price-card .type-label {
  font-family: var(--serif-en); font-style: italic; font-size: 13px;
  color: var(--gold-bright); letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 6px;
}
.price-card .type-th { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: 0.05em; margin: 0 0 28px; }
.price-card .purity {
  display: inline-block; font-family: var(--mono); font-size: 10px; color: var(--gold);
  border: 1px solid var(--gold-soft); padding: 2px 8px; margin-left: 10px;
  letter-spacing: 0.1em; vertical-align: middle; position: relative; top: -3px;
}
.price-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 48px;
  padding-top: 24px; border-top: 1px solid var(--border); position: relative;
}
.price-row::before {
  content: ''; position: absolute; left: 50%; top: 24px; bottom: 0; width: 1px;
  background: linear-gradient(180deg, transparent, var(--gold-soft) 30%, var(--gold-soft) 70%, transparent);
  opacity: 0.4;
}
.price-row .col .label {
  font-size: 12px; color: var(--text-dim); letter-spacing: 0.16em; margin-bottom: 10px;
  text-transform: uppercase; font-family: var(--serif-en); font-style: italic;
}
.price-row .col .label::before {
  content: ''; display: inline-block; width: 14px; height: 1px;
  background: var(--gold); vertical-align: middle; margin-right: 8px;
}
.price-row .col .value {
  font-family: var(--mono); font-weight: 500; font-size: 44px;
  letter-spacing: 0.02em; line-height: 1.05;
  background: linear-gradient(95deg, #c9a24a 0%, #fff4cc 35%, #f8e2a8 50%, #fff4cc 65%, #c9a24a 100%);
  background-size: 250% auto; -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; animation: goldSheen 6s linear infinite;
}
@keyframes goldSheen { to { background-position: -250% center; } }
.price-row .col .unit { font-size: 12px; color: var(--text-mute); margin-top: 8px; letter-spacing: 0.04em; }
.delta {
  position: absolute; top: 36px; right: 48px; font-family: var(--mono); font-size: 14px;
  z-index: 3; padding: 6px 12px; border: 1px solid currentColor;
  border-radius: 999px; background: rgba(0,0,0,0.25);
}
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }

/* Chart */
.chart-card {
  background: var(--surface); border: 1px solid var(--border);
  padding: 28px 32px 16px; backdrop-filter: blur(14px);
  box-shadow: 0 20px 50px -20px rgba(0,0,0,0.5);
}
.chart-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 16px; flex-wrap: wrap; }
.chart-title { font-size: 14px; color: var(--text-dim); letter-spacing: 0.04em; }
.chart-controls { display: flex; border: 1px solid var(--border); }
.chart-controls button {
  background: transparent; border: none; color: var(--text-mute);
  padding: 6px 14px; font-size: 12px; letter-spacing: 0.08em;
  border-right: 1px solid var(--border); transition: all 0.2s;
}
.chart-controls button:last-child { border-right: none; }
.chart-controls button.active { background: rgba(230,199,121,0.16); color: var(--gold-bright); }
.chart-svg { width: 100%; height: 220px; display: block; }
.chart-stats {
  display: flex; gap: 32px; font-family: var(--mono); font-size: 12px; color: var(--text-dim);
  margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap;
}
.chart-stats span b { color: var(--text); font-weight: 500; margin-left: 6px; }

/* Calculator */
.calc-layout {
  display: grid; grid-template-columns: 1.1fr 1fr; gap: 1px;
  background: var(--border); border: 1px solid var(--border);
  box-shadow: 0 20px 50px -20px rgba(0,0,0,0.5);
}
.calc-form, .calc-result { background: var(--surface); padding: 36px; backdrop-filter: blur(14px); }
.calc-result {
  background: linear-gradient(180deg, rgba(230,199,121,0.08), transparent 40%), var(--surface-2);
}
.field-group { display: grid; gap: 22px; }
.field label {
  display: block; font-size: 12px; color: var(--text-mute);
  letter-spacing: 0.1em; margin-bottom: 8px; text-transform: uppercase;
  font-family: var(--serif-en); font-style: italic;
}
.field label .th { font-family: var(--serif-th); font-style: normal; text-transform: none; color: var(--text-dim); margin-right: 8px; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); border: 1px solid var(--border-bright); }
.seg button {
  background: transparent; border: none; border-right: 1px solid var(--border-bright);
  color: var(--text-dim); padding: 13px 8px; font-size: 14px; transition: all 0.2s;
}
.seg button:last-child { border-right: none; }
.seg button.active {
  background: linear-gradient(180deg, rgba(230,199,121,0.28), rgba(230,199,121,0.12));
  color: var(--gold-bright); font-weight: 600; box-shadow: inset 0 0 0 1px var(--gold);
}
.weight-input {
  display: grid; grid-template-columns: 1fr auto; align-items: stretch;
  border: 1px solid var(--border-bright); background: var(--bg-2);
}
.weight-input input {
  background: transparent; border: none; color: var(--gold-bright);
  font-family: var(--mono); font-size: 28px; padding: 14px 18px; outline: none;
  font-weight: 500; width: 100%; min-width: 0;
}
.weight-input input::placeholder { color: var(--text-mute); }
.weight-input .unit-pick { display: flex; border-left: 1px solid var(--border-bright); }
.weight-input .unit-pick button {
  background: transparent; border: none; color: var(--text-mute); padding: 0 14px;
  font-size: 13px; border-right: 1px solid var(--border); transition: all 0.2s; min-width: 56px;
}
.weight-input .unit-pick button:last-child { border-right: none; }
.weight-input .unit-pick button.active { background: rgba(230,199,121,0.16); color: var(--gold-bright); }
.extra-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.simple-input { border: 1px solid var(--border-bright); background: var(--bg-2); }
.simple-input input {
  background: transparent; border: none; color: var(--text);
  font-family: var(--mono); font-size: 16px; padding: 12px 14px; outline: none; width: 100%;
}

/* Result */
.result-eyebrow {
  font-family: var(--serif-en); font-style: italic; font-size: 12px;
  color: var(--gold); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px;
}
.result-title { font-size: 18px; color: var(--text); margin-bottom: 24px; letter-spacing: 0.04em; }
.result-amount {
  font-family: var(--mono); font-size: 56px; font-weight: 500; line-height: 1; margin: 18px 0 8px;
  background: linear-gradient(95deg, #c9a24a 0%, #fff4cc 35%, #f8e2a8 50%, #fff4cc 65%, #c9a24a 100%);
  background-size: 250% auto; -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; animation: goldSheen 6s linear infinite;
}
.result-amount .baht-sign {
  font-family: var(--serif-th); font-size: 24px; color: var(--gold);
  margin-right: 12px; vertical-align: top; position: relative; top: 14px;
  -webkit-text-fill-color: var(--gold); background: none; animation: none;
}
.result-amount.zero { background: none; -webkit-text-fill-color: var(--text-mute); animation: none; }
.result-sub { font-size: 13px; color: var(--text-mute); letter-spacing: 0.04em; margin-bottom: 28px; }
.result-breakdown { border-top: 1px solid var(--border); padding-top: 18px; display: grid; gap: 10px; font-size: 13px; }
.result-breakdown .row { display: flex; justify-content: space-between; align-items: baseline; color: var(--text-dim); }
.result-breakdown .row .v { font-family: var(--mono); color: var(--text); }
.result-breakdown .row.total { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 6px; font-size: 15px; }
.result-breakdown .row.total .v { color: var(--gold-bright); font-size: 18px; font-weight: 500; }
.action-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-top: 32px; }
.btn-primary {
  background: linear-gradient(180deg, #f4dba0, #c9a24a); color: #1a1208; font-weight: 700;
  border: 1px solid var(--gold-bright); padding: 14px 22px; font-size: 14px; letter-spacing: 0.1em;
  box-shadow: 0 8px 32px -8px rgba(230,199,121,0.6), inset 0 1px 0 rgba(255,255,255,0.35);
  transition: all 0.2s;
}
.btn-primary:hover { background: linear-gradient(180deg, #fae4b3, #e6c779); transform: translateY(-1px); }
.btn-primary:disabled { background: var(--surface-3); color: var(--text-mute); border-color: var(--border); box-shadow: none; cursor: not-allowed; }
.btn-ghost {
  background: transparent; color: var(--text-mute); border: 1px solid var(--border-bright);
  padding: 14px 22px; font-size: 14px; letter-spacing: 0.1em; transition: all 0.2s;
}
.btn-ghost:hover { color: var(--text); border-color: var(--gold-soft); }

/* History */
.history-search { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.history-search .search-input {
  flex: 1; min-width: 240px; border: 1px solid var(--border-bright);
  background: var(--bg-2); display: flex; align-items: center; padding: 0 14px;
}
.history-search input {
  background: transparent; border: none; color: var(--text);
  font-family: var(--mono); font-size: 14px; padding: 12px 0; outline: none; width: 100%;
}
.seg-4 { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--border-bright); min-width: 280px; }
.seg-4 button {
  background: transparent; border: none; border-right: 1px solid var(--border-bright);
  color: var(--text-dim); padding: 13px 8px; font-size: 13px; transition: all 0.2s;
}
.seg-4 button:last-child { border-right: none; }
.seg-4 button.active { background: linear-gradient(180deg, rgba(230,199,121,0.28), rgba(230,199,121,0.12)); color: var(--gold-bright); font-weight: 600; box-shadow: inset 0 0 0 1px var(--gold); }
.history-table {
  width: 100%; border-collapse: collapse; border: 1px solid var(--border);
  background: var(--surface); font-size: 13px; backdrop-filter: blur(14px);
  box-shadow: 0 20px 50px -20px rgba(0,0,0,0.5);
}
.history-table th {
  text-align: left; font-family: var(--serif-en); font-style: italic; font-weight: 400;
  font-size: 11px; color: var(--gold); letter-spacing: 0.16em; text-transform: uppercase;
  padding: 14px 18px; border-bottom: 1px solid var(--border-bright); background: var(--surface-2);
}
.history-table th .th { display: block; font-family: var(--serif-th); font-style: normal; color: var(--text-dim); text-transform: none; letter-spacing: 0.04em; font-size: 12px; margin-top: 2px; }
.history-table td { padding: 16px 18px; border-top: 1px solid var(--border); color: var(--text-dim); vertical-align: middle; }
.history-table tr:hover td { background: rgba(201,162,74,0.03); }
.history-table .code { font-family: var(--mono); color: var(--gold-bright); font-size: 13px; letter-spacing: 0.06em; }
.history-table .amount { font-family: var(--mono); color: var(--text); text-align: right; font-weight: 500; }
.history-table .badge { display: inline-block; font-size: 11px; padding: 2px 10px; border: 1px solid currentColor; letter-spacing: 0.06em; }
.history-table .badge.buy { color: var(--up); }
.history-table .badge.sell { color: var(--down); }
.history-table .badge.trade { color: var(--gold); }
.history-table .badge.bar { color: var(--text-dim); }
.history-table .icon-btn {
  background: transparent; border: 1px solid var(--border-bright); color: var(--gold);
  padding: 6px 10px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; transition: all 0.2s;
}
.history-table .icon-btn:hover { background: rgba(201,162,74,0.08); border-color: var(--gold-soft); }
.history-empty { background: var(--surface); border: 1px solid var(--border); padding: 60px 20px; text-align: center; color: var(--text-mute); }
.history-empty .symbol { font-family: var(--serif-en); font-style: italic; font-size: 36px; color: var(--gold-soft); margin-bottom: 8px; }

/* Receipt */
.receipt-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
  z-index: 100; display: grid; place-items: center; padding: 20px; overflow-y: auto; animation: fade 0.2s;
}
@keyframes fade { from { opacity: 0; } }
.receipt {
  background: #faf6ec; color: #1a1208; width: 100%; max-width: 480px; padding: 48px 40px;
  font-family: var(--serif-th); position: relative; box-shadow: 0 40px 80px rgba(0,0,0,0.5); border: 1px solid #c9a24a;
}
.receipt::before { content: ''; position: absolute; inset: 8px; border: 1px solid #c9a24a; pointer-events: none; }
.receipt-header { text-align: center; border-bottom: 1px dashed #8b6420; padding-bottom: 22px; margin-bottom: 24px; }
.receipt-mark { font-family: var(--serif-en); font-style: italic; font-size: 30px; font-weight: 700; color: #8b6420; }
.receipt-shop { font-size: 18px; font-weight: 700; letter-spacing: 0.06em; }
.receipt-sub { font-size: 11px; color: #6e4f1c; letter-spacing: 0.16em; text-transform: uppercase; margin-top: 6px; font-family: var(--serif-en); }
.receipt-doc { font-size: 14px; letter-spacing: 0.06em; color: #6e4f1c; margin-top: 16px; }

const MANAGER_PIN_KEY = 'gc_manager_pin';
const DEFAULT_PIN = '1234';

function TweaksPanel({ children, open, onClose }) {
  const dragRef = useRef(null);
  const offsetRef = useRef({ x: 16, y: 16 });
  const [pinInput, setPinInput] = useState('');
  const [pinError, setPinError] = useState('');
  const [unlocked, setUnlocked] = useState(false);

  // reset lock every time panel closes
  useEffect(() => { if (!open) { setUnlocked(false); setPinInput(''); setPinError(''); } }, [open]);

  const checkPin = () => {
    const stored = localStorage.getItem(MANAGER_PIN_KEY) || DEFAULT_PIN;
    if (pinInput === stored) { setUnlocked(true); setPinError(''); }
    else { setPinError('รหัสไม่ถูกต้อง'); setPinInput(''); }
  };

  const onDragStart = (e) => {
    const panel = dragRef.current; if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const sr = window.innerWidth - r.right, sb = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: sr - (ev.clientX - sx), y: sb - (ev.clientY - sy) };
      panel.style.right = offsetRef.current.x + 'px';
      panel.style.bottom = offsetRef.current.y + 'px';
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{TWEAK_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: 16, bottom: 16 }}>
        <div className="twk-hd" onMouseDown={onDragStart}>

/* ── Formatting ── */
const fmt = (n, d = 2) => Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtInt = (n) => Number(n || 0).toLocaleString('th-TH');
const THAI_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const formatThaiDate = (d, opts = {}) => {
  const date = d instanceof Date ? d : new Date(d);
  const day = date.getDate();
  const m = THAI_MONTHS_SHORT[date.getMonth()];
  const y = date.getFullYear() + 543;
  const yStr = opts.shortYear ? String(y).slice(-2) : y;
  if (opts.withTime) {
    const hh = String(date.getHours()).padStart(2,'0');
    const mm = String(date.getMinutes()).padStart(2,'0');
    return `${day} ${m} ${yStr}  ${hh}:${mm} น.`;
  }
  return `${day} ${m} ${yStr}`;
};

const GRAMS_PER_BAHT = 15.16;
const toBaht = (value, unit) => {
  const v = Number(value) || 0;
  if (unit === 'baht') return v;
  if (unit === 'salueng') return v / 4;
  if (unit === 'gram') return v / GRAMS_PER_BAHT;
  return v;
};

/* ── Chart series ── */
function generateSeries(endValue, days = 365) {
  const out = []; let seed = 1234;
  const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const today = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const date = new Date(today); date.setDate(today.getDate() - i);
    const trend = ((days - i) / days) * (endValue - endValue * 0.85);
    const noise = (rand() - 0.5) * 250;
    const swing = Math.sin(i / 18) * 180;
    const v = Math.round(endValue * 0.85 + trend + noise + swing);
    out.push({ date, value: v });
  }
  out[out.length - 1].value = endValue;
  return out;
}

function makeCode(counter) {
  const d = new Date();
  const yy = String((d.getFullYear() + 543) % 100).padStart(2,'0');
  const mm = String(d.getMonth() + 1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `GC-${yy}${mm}${dd}-${String(counter).padStart(4,'0')}`;
}

/* ── Calculator ── */
function Calculator({ prices, onCommit, apiStatus, apiSell, branch }) {
  const [mode, setMode] = useState('sell');
  const [weight, setWeight] = useState('1');
  const [unit, setUnit] = useState('baht');
  const [discount, setDiscount] = useState('0');
  const [laborFee, setLaborFee] = useState('0');
  const weightBaht = toBaht(weight, unit);
  const barConfig = branch?.branch_configs?.find(c => c.gold_type === 'bar') ?? null;
  const calc = useMemo(() => {
    const p = prices.bar;
    const pricePerBaht = mode === 'sell' ? p.sell : Math.round(p.sell * 0.95);
    const basePrice = pricePerBaht * weightBaht;
    const laborFeeNum = Number(laborFee || 0);
    const discountNum = Number(discount || 0);
    const total = basePrice + laborFeeNum - discountNum;
    const descAction = mode === 'sell' ? 'ขายทองให้ลูกค้า' : 'รับซื้อทองจากลูกค้า';
    const laborWarn = barConfig && laborFeeNum > 0 && (laborFeeNum < barConfig.labor_fee_min || laborFeeNum > barConfig.labor_fee_max);
    const discountWarn = barConfig && discountNum > 0 && discountNum > barConfig.discount_max_baht;
    return { pricePerBaht, basePrice, total, descAction, laborFeeNum, discountNum, laborWarn, discountWarn };
  }, [mode, weight, unit, discount, laborFee, prices, weightBaht, barConfig]);
  const apiOffline = apiStatus !== 'ok';
  const canCommit = weightBaht > 0 && calc.total > 0 && !isNaN(calc.total) && !apiOffline;
  const commit = () => {
    if (!canCommit) return;
    onCommit({ mode, type:'bar', weight:Number(weight), unit, weightBaht,
      pricePerBaht: calc.pricePerBaht, labor:0, laborFee: calc.laborFeeNum,
      basePrice: calc.basePrice, discount: calc.discountNum,
      oldType:null, oldWeight:0, oldUnit:null, oldWeightBaht:0, oldPricePerBaht:0, oldBuy:0,
      total: calc.total, descAction: calc.descAction,
      apiSell: apiSell });
  };
  return (
    <section>
      <div className="section-head">
        <div className="title"><span className="index">No. II.</span><h2>คำนวณราคา</h2></div>
        <span className="meta">CALCULATOR · GOLD BAR</span>
      </div>
      <div className="calc-layout">
        <div className="calc-form">
          <div className="field-group">
            <div className="field">
              <label><span className="th">ประเภทรายการ</span> Transaction</label>
              <div className="seg">
                <button className={mode==='sell'?'active':''} onClick={() => setMode('sell')}>ขายให้ลูกค้า</button>
                <button className={mode==='buy'?'active':''} onClick={() => setMode('buy')}>รับซื้อจากลูกค้า</button>
              </div>
            </div>
            <div className="field">
              <label><span className="th">น้ำหนักทองคำแท่ง</span> Weight</label>
              <div className="weight-input">
                <input type="text" inputMode="decimal" value={weight}
                  onChange={e => setWeight(e.target.value.replace(/[^0-9.]/g,''))} placeholder="0.00" />
                <div className="unit-pick">
                  <button className={unit==='baht'?'active':''} onClick={() => setUnit('baht')}>บาท</button>
                  <button className={unit==='salueng'?'active':''} onClick={() => setUnit('salueng')}>สลึง</button>
                  <button className={unit==='gram'?'active':''} onClick={() => setUnit('gram')}>กรัม</button>
                </div>
              </div>
              <div style={{fontSize:11,color:'var(--text-mute)',marginTop:6,fontFamily:'var(--mono)'}}>
                = {fmt(weightBaht,2)} บาท · {fmt(weightBaht*GRAMS_PER_BAHT,2)} ก.
              </div>
            </div>
            <div className="extra-grid">
              <div className="field">
                <label>
                  <span className="th">ค่ากำเหน็จ</span> Labor Fee
                  {barConfig && <span style={{color:'var(--text-mute)',fontSize:10,marginLeft:8,fontFamily:'var(--mono)'}}>({fmt(barConfig.labor_fee_min,0)}–{fmt(barConfig.labor_fee_max,0)} บาท)</span>}
                </label>
                <div className="simple-input">
                  <input type="text" inputMode="numeric" value={laborFee}
                    onChange={e => setLaborFee(e.target.value.replace(/[^0-9]/g,''))} />
                </div>
                {calc.laborWarn && <div style={{fontSize:11,color:'#e09478',marginTop:4}}>⚠ นอกช่วงที่กำหนด</div>}
              </div>
              <div className="field">
                <label>
                  <span className="th">ส่วนลด</span> Discount
                  {barConfig && barConfig.discount_max_baht > 0 && <span style={{color:'var(--text-mute)',fontSize:10,marginLeft:8,fontFamily:'var(--mono)'}}}>(สูงสุด {fmt(barConfig.discount_max_baht,0)} บาท)</span>}
                </label>
                <div className="simple-input">
                  <input type="text" inputMode="numeric" value={discount}
                    onChange={e => setDiscount(e.target.value.replace(/[^0-9]/g,''))} />
                </div>
                {calc.discountWarn && <div style={{fontSize:11,color:'#e09478',marginTop:4}}>⚠ เกินส่วนลดสูงสุด</div>}
              </div>
            </div>
          </div>
        </div>
        <div className="calc-result">
          <div className="result-eyebrow">{calc.descAction}</div>
          <div className="result-title">ยอดรวม{mode==='buy'?'รับซื้อ':'ที่ลูกค้าต้องชำระ'}</div>
          <div className={`result-amount ${calc.total<=0?'zero':''}`}>
            <span className="baht-sign">฿</span>{fmt(Math.max(calc.total,0),2)}
          </div>
          <div className="result-sub">น้ำหนักทองคำ {fmt(weightBaht,2)} บาท ({fmt(weightBaht*GRAMS_PER_BAHT,2)} กรัม)</div>
          <div className="result-breakdown">
            <div className="row">
              <span>ราคาเนื้อทอง ({fmt(weightBaht,2)} × {fmt(calc.pricePerBaht,0)})</span>
              <span className="v">{fmt(calc.basePrice,2)}</span>
            </div>
            {calc.laborFeeNum > 0 && (
              <div className="row"><span>ค่ากำเหน็จ</span><span className="v" style={{color:'var(--gold)'}}>+ {fmt(calc.laborFeeNum,2)}</span></div>
            )}
            {calc.discountNum > 0 && (
              <div className="row"><span>ส่วนลด</span><span className="v" style={{color:'var(--down)'}}>− {fmt(calc.discountNum,2)}</span></div>
            )}
            <div className="row total"><span>รวมสุทธิ</span><span className="v">฿ {fmt(calc.total,2)}</span></div>
          </div>
          {apiOffline && (
            <div style={{background:'rgba(224,148,120,0.15)',border:'1px solid rgba(224,148,120,0.4)',padding:'10px 14px',fontSize:12,color:'#e09478',letterSpacing:'0.04em',marginTop:24}}>
              ⚠ ไม่สามารถบันทึกได้ — ราคาไม่ได้มาจากระบบ API<br/>
              <span style={{fontSize:11,opacity:0.8}}>กรุณารอจนกว่าราคาจะแสดง "ข้อมูลสด" แล้วลองใหม่</span>
            </div>
          )}
          <div className="action-row">
            <button className="btn-primary" disabled={!canCommit} onClick={commit}>บันทึก &amp; ออกใบประเมิน</button>
            <button className="btn-ghost" onClick={() => { setWeight(''); setDiscount('0'); setLaborFee('0'); }}>ล้าง</button>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ── Chart ── */
function PriceChart({ data, range, setRange }) {
  const [hover, setHover] = useState(null);
  const W = 1180, H = 220, PL = 50, PR = 10, PT = 16, PB = 26;
  const slice = useMemo(() => {
    const n = Math.min({ '7':7,'30':30,'90':90,'365':365 }[range]||30, data.length);
    return data.slice(-n);
  }, [data, range]);
  const { min, max, points } = useMemo(() => {
    const vals = slice.map(d => d.value);
    const mn = Math.min(...vals), mx = Math.max(...vals);
    const pad = (mx-mn)*0.2||100;
    const minV = mn-pad, maxV = mx+pad;
    const pts = slice.map((d,i) => ({
      x: PL + (i/Math.max(slice.length-1,1))*(W-PL-PR),
      y: PT + (1-(d.value-minV)/(maxV-minV))*(H-PT-PB),
      ...d
    }));
    return { min:minV, max:maxV, points:pts };
  }, [slice]);
  const lineD = points.map((p,i) => `${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area = lineD + ` L${points[points.length-1].x},${H-PB} L${points[0].x},${H-PB} Z`;
  const first = slice[0]?.value??0, last = slice[slice.length-1]?.value??0;
  const change = last-first, changePct = first?(change/first)*100:0;
  const highVal = Math.max(...slice.map(d=>d.value)), lowVal = Math.min(...slice.map(d=>d.value));
  const ticks = [0,0.25,0.5,0.75,1].map(t => ({ y: PT+t*(H-PT-PB), v: max-t*(max-min) }));
  const onMove = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX-r.left)/r.width)*W;
    const ratio = Math.max(0,Math.min(1,(x-PL)/(W-PL-PR)));
    setHover(points[Math.round(ratio*(slice.length-1))]);
  };
  return (
    <section>
      <div className="section-head">
        <div className="title"><span className="index">No. III.</span><h2>ราคาย้อนหลัง — ทองคำแท่ง ขายออก</h2></div>
        <span className="meta">HISTORICAL · THB / BAHT</span>
      </div>
      <div className="chart-card">
        <div className="chart-header">
          <div className="chart-title">ความเคลื่อนไหวของราคาในช่วงที่เลือก</div>
          <div className="chart-controls">
            {[['7','7 วัน'],['30','30 วัน'],['90','3 เดือน'],['365','1 ปี']].map(([k,l]) => (
              <button key={k} className={range===k?'active':''} onClick={() => setRange(k)}>{l}</button>
            ))}
          </div>
        </div>
        <svg className="chart-svg" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
          <defs>
            <linearGradient id="ga" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor="#e6c779" stopOpacity="0.45"/>
              <stop offset="100%" stopColor="#e6c779" stopOpacity="0"/>
            </linearGradient>
            <linearGradient id="gl" x1="0" x2="1">
              <stop offset="0%" stopColor="#c9a24a"/>
              <stop offset="50%" stopColor="#fae4b3"/>
              <stop offset="100%" stopColor="#c9a24a"/>
            </linearGradient>
          </defs>
          {ticks.map((t,i) => (
            <g key={i}>
              <line x1={PL} x2={W-PR} y1={t.y} y2={t.y} stroke="#3d3120" strokeWidth="1" strokeDasharray={i===0||i===4?'0':'2 4'}/>
              <text x={PL-8} y={t.y+4} fill="#9c8b6a" fontSize="10" textAnchor="end" fontFamily="monospace">{fmt(t.v,0)}</text>
            </g>
          ))}
          <path d={area} fill="url(#ga)"/>
          <path d={lineD} stroke="url(#gl)" strokeWidth="1.75" fill="none"/>
          {hover && (
            <g>
              <line x1={hover.x} x2={hover.x} y1={PT} y2={H-PB} stroke="#e6c779" strokeOpacity="0.5" strokeDasharray="2 3"/>
              <circle cx={hover.x} cy={hover.y} r="4" fill="#fae4b3" stroke="#1a1208" strokeWidth="1.5"/>
              <g transform={`translate(${Math.min(hover.x+10,W-150)},${Math.max(hover.y-30,PT)})`}>
                <rect width="140" height="40" fill="#15110b" stroke="#50412a"/>
                <text x="10" y="16" fill="#d8c89e" fontSize="11">{formatThaiDate(hover.date,{shortYear:true})}</text>
                <text x="10" y="32" fill="#f4dba0" fontSize="13" fontFamily="monospace" fontWeight="500">{fmtInt(hover.value)} บาท</text>
              </g>
            </g>
          )}
          <text x={PL} y={H-8} fill="#9c8b6a" fontSize="10">{formatThaiDate(slice[0]?.date)}</text>
          <text x={W-PR} y={H-8} fill="#9c8b6a" fontSize="10" textAnchor="end">{formatThaiDate(slice[slice.length-1]?.date)}</text>
        </svg>
        <div className="chart-stats">
          <span>เปลี่ยนแปลง <b style={{color:change>=0?'var(--up)':'var(--down)'}}>{change>=0?'+':''}{fmt(change,0)} ({changePct>=0?'+':''}{fmt(changePct,2)}%)</b></span>
          <span>สูงสุด <b>{fmt(highVal,0)}</b></span>
          <span>ต่ำสุด <b>{fmt(lowVal,0)}</b></span>
          <span>ปัจจุบัน <b style={{color:'var(--gold-bright)'}}>{fmt(last,0)}</b></span>
        </div>
      </div>
    </section>
  );
}

/* ── History ── */
function exportCSV(records) {
  const headers = ['รหัสรายการ','วัน เวลา','ประเภท','ชนิดทอง','น้ำหนัก','หน่วย','ราคาที่ใช้/บาท','ราคา API ณ เวลานั้น','ส่วนต่าง','ส่วนลด','ยอดรวม','สถานะราคา'];
  const rows = records.map(r => {
    const apiSell = r.apiSell || null;
    const expected = apiSell ? (r.mode === 'buy' ? Math.round(apiSell * 0.95) : apiSell) : null;
    const diff = expected !== null ? r.pricePerBaht - expected : '';
    const status = expected === null ? 'ไม่มีข้อมูล API' : Math.abs(diff) <= 50 ? 'ปกติ' : '⚠ ผิดปกติ';
    return [
      r.code,
      new Date(r.timestamp).toLocaleString('th-TH'),
      r.descAction,
      r.type === 'bar' ? 'ทองแท่ง' : 'ทองรูปพรรณ',
      r.weight,
      r.unit === 'baht' ? 'บาท' : r.unit === 'salueng' ? 'สลึง' : 'กรัม',
      r.pricePerBaht,
      apiSell ?? '-',
      diff !== '' ? diff : '-',
      r.discount || 0,
      r.total,
      status,
    ];
  });
  const csv = [headers, ...rows].map(row => row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gold-ledger-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function PriceStatusBadge({ record }) {
  if (!record.apiSell) return <span style={{color:'var(--text-mute)',fontSize:11}}>—</span>;
  const expected = record.mode === 'buy' ? Math.round(record.apiSell * 0.95) : record.apiSell;
  const diff = record.pricePerBaht - expected;
  const ok = Math.abs(diff) <= 50;
  return (
    <span style={{
      fontSize:11, padding:'2px 8px', border:'1px solid currentColor',
      color: ok ? 'var(--up)' : '#e09478',
      letterSpacing:'0.04em',
    }}>
      {ok ? '✓ ปกติ' : `⚠ ต่าง ${diff > 0 ? '+' : ''}${diff}`}
    </span>
  );
}

function HistorySection({ records, onLookup, query, setQuery }) {
  const [filter, setFilter] = useState('all');
  const filtered = useMemo(() => {
    let r = records;
    if (filter!=='all') r = r.filter(x => x.mode===filter);
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      r = r.filter(x => x.code.toLowerCase().includes(q) || formatThaiDate(x.timestamp).toLowerCase().includes(q));
    }
    return r.slice().reverse();
  }, [records, query, filter]);

  const flagged = useMemo(() => records.filter(r => {
    if (!r.apiSell) return false;
    const expected = r.mode === 'buy' ? Math.round(r.apiSell * 0.95) : r.apiSell;
    return Math.abs(r.pricePerBaht - expected) > 50;
  }).length, [records]);

  return (
    <section className="history-section">
      <div className="section-head">
        <div className="title">
          <span className="index">No. IV.</span>
          <h2>ประวัติการคำนวณ</h2>
          {flagged > 0 && (
            <span style={{fontSize:12,color:'#e09478',border:'1px solid #e09478',padding:'2px 10px',marginLeft:8}}>
              ⚠ {flagged} รายการผิดปกติ
            </span>
          )}
        </div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          <button onClick={() => exportCSV(records)} style={{
            background:'transparent',border:'1px solid var(--gold-soft)',color:'var(--gold)',
            padding:'6px 14px',fontSize:12,letterSpacing:'0.08em',cursor:'pointer',fontFamily:'var(--serif-th)'
          }}>↓ Export CSV</button>
          <span className="meta">LEDGER · {fmtInt(records.length)} รายการ</span>
        </div>
      </div>
      <div className="history-search">
        <div className="search-input">
          <input type="text" value={query} onChange={e => setQuery(e.target.value)} placeholder="ค้นหารหัสรายการ เช่น GC-690513-0001"/>
        </div>
        <div className="seg-4">
          {[['all','ทั้งหมด'],['sell','ขาย'],['buy','รับซื้อ'],['trade','เปลี่ยน']].map(([k,l]) => (
            <button key={k} className={filter===k?'active':''} onClick={() => setFilter(k)}>{l}</button>
          ))}
        </div>
      </div>
      {filtered.length===0 ? (
        <div className="history-empty">
          <div className="symbol">∽</div>
          <div>{records.length===0?'ยังไม่มีรายการคำนวณ':'ไม่พบรายการที่ค้นหา'}</div>
        </div>
      ) : (
        <table className="history-table">
          <thead><tr>
            <th>Code<span className="th">รหัสรายการ</span></th>
            <th>Date<span className="th">วัน เวลา</span></th>
            <th>Type<span className="th">รายการ</span></th>
            <th>Weight<span className="th">น้ำหนัก</span></th>
            <th>Price<span className="th">ราคาที่ใช้/บาท</span></th>
            <th>API<span className="th">ราคา API</span></th>
            <th>Check<span className="th">ตรวจสอบ</span></th>
            <th style={{textAlign:'right'}}>Total<span className="th">ยอดรวม</span></th>
            <th></th>
          </tr></thead>
          <tbody>
            {filtered.map(r => (
              <tr key={r.code}>
                <td className="code">{r.code}</td>
                <td>{formatThaiDate(r.timestamp,{withTime:true})}</td>
                <td>
                  <span className={`badge ${r.mode}`}>{r.mode==='sell'?'ขาย':r.mode==='buy'?'รับซื้อ':'เปลี่ยน'}</span>
                </td>
                <td style={{fontFamily:'var(--mono)'}}>{fmt(r.weight,2)} {r.unit==='baht'?'บ.':r.unit==='salueng'?'สลึง':'ก.'}</td>
                <td style={{fontFamily:'var(--mono)'}}>{fmt(r.pricePerBaht,0)}</td>
                <td style={{fontFamily:'var(--mono)',color:'var(--text-mute)'}}>{r.apiSell ? fmt(r.apiSell,0) : '—'}</td>
                <td><PriceStatusBadge record={r} /></td>
                <td className="amount">{fmt(r.total,2)}</td>
                <td style={{textAlign:'right'}}><button className="icon-btn" onClick={() => onLookup(r)}>ดู / พิมพ์</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </section>
  );
}

        </div>
        <div className="receipt-actions">
          <button onClick={() => window.print()}>พิมพ์ใบประเมิน</button>
          <button className="close" onClick={onClose}>ปิด</button>

      </div>
    </div>
  );
}

/* ── Live price hook (Hua Seng Heng API) ── */
const HSH_API = 'https://apicheckpricev3.huasengheng.com/api/values/getprice/';
const REFRESH_MS = 5 * 60 * 1000; // 5 minutes

function useGoldPrice(fallbackBuy, fallbackSell) {
  const [live, setLive] = useState(null);   // { buy, sell, buyChange, sellChange, strTime }
  const [status, setStatus] = useState('loading'); // loading | ok | error

  const fetchPrice = useCallback(async () => {
    try {
      const res = await fetch(HSH_API, { headers: { Accept: 'application/json' } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const d = json.find(x => x.GoldType === 'REF' && x.GoldCode === '96.50');
      if (!d) throw new Error('ไม่พบข้อมูล 96.50%');
      setLive({
        buy:        Number(String(d.Buy).replace(/,/g, '')),
        sell:       Number(String(d.Sell).replace(/,/g, '')),
        buyChange:  Number(String(d.BuyChange  || 0).replace(/,/g, '')),
        sellChange: Number(String(d.SellChange || 0).replace(/,/g, '')),
        strTime:    d.StrTimeUpdate || '',
      });
      setStatus('ok');
    } catch (err) {
      console.warn('HSH API error:', err.message);
      setStatus('error');
    }
  }, []);

  useEffect(() => {
    fetchPrice();
    const id = setInterval(fetchPrice, REFRESH_MS);
    return () => clearInterval(id);
  }, [fetchPrice]);

  const buy  = live ? live.buy  : fallbackBuy;
  const sell = live ? live.sell : fallbackSell;
  const delta = live ? live.sellChange : 0;
  return { buy, sell, delta, strTime: live?.strTime ?? '', status, refresh: fetchPrice };
}

/* ── App ── */
const STORAGE_HISTORY = 'gc_history_v1';
const STORAGE_COUNTER = 'gc_counter_v1';
const TWEAK_DEFAULTS = {
  shopName: 'ห้างทอง รัตนกาญจน์',
  shopEn: 'Ratanakarn Gold · Est. 2510',
  barBuy: 48250, barSell: 48350,
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const { buy, sell, delta, strTime, status, refresh } = useGoldPrice(t.barBuy, t.barSell);

  const [history, setHistory] = useState(() => {
    try { const r = localStorage.getItem(STORAGE_HISTORY); return r ? JSON.parse(r) : seedHistory(); } catch { return seedHistory(); }
  });
  const [counter, setCounter] = useState(() => {
    try { const r = localStorage.getItem(STORAGE_COUNTER); return r ? Number(r) : history.length+1; } catch { return history.length+1; }
  });
  const [activeReceipt, setActiveReceipt] = useState(null);
  const [range, setRange] = useState('30');
  const [query, setQuery] = useState('');
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const { branch } = useBranchConfig();
  const [pendingRecord, setPendingRecord] = useState(null);

  const prices     = useMemo(() => ({ bar: { buy, sell } }), [buy, sell]);
  const lastChange = useMemo(() => ({ bar: delta }), [delta]);
  const chartData  = useMemo(() => generateSeries(sell, 365), [sell]);

  useEffect(() => { try { localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history)); } catch {} }, [history]);
  useEffect(() => { try { localStorage.setItem(STORAGE_COUNTER, String(counter)); } catch {} }, [counter]);

  const handleCommit = useCallback(payload => {
    const code = makeCode(counter);
    const record = { ...payload, code, timestamp: new Date().toISOString() };
    setPendingRecord(record);
  }, [counter]);

  const handleConfirmed = useCallback(employeeName => {
    if (!pendingRecord) return;
    const rec = { ...pendingRecord, employeeName };
    setHistory(h => [...h, rec]);
    setCounter(c => c + 1);
    setActiveReceipt(rec);
    setPendingRecord(null);
  }, [pendingRecord]);

  return (
    <>
      <SiteHeader shopName={t.shopName} shopEn={t.shopEn} onTweaks={() => setTweaksOpen(o => !o)} />
      <main className="page">
        <PricesSection prices={prices} lastChange={lastChange} status={status} strTime={strTime} onRefresh={refresh} />
        <Calculator prices={prices} onCommit={handleCommit} apiStatus={status} apiSell={sell} branch={branch} />
        <PriceChart data={chartData} range={range} setRange={setRange} />
        <HistorySection records={history} onLookup={r => setActiveReceipt(r)} query={query} setQuery={setQuery} />
      </main>
      <footer className="site-foot">
        <div className="ornament-row">❖ &nbsp;&nbsp; ✦ &nbsp;&nbsp; ❖</div>
        <div>{t.shopName} · ห้างทองคำมาตรฐาน 96.5%</div>
        <div style={{marginTop:6}}>ราคาอ้างอิงจากสมาคมค้าทองคำแห่งประเทศไทย · ระบบนี้ใช้สำหรับประเมินราคาเบื้องต้น</div>
      </footer>
      {pendingRecord && (
        <CommitModal
          record={pendingRecord}
          branch={branch}
          onSuccess={handleConfirmed}
          onCancel={() => setPendingRecord(null)}
        />
      )}
      <Receipt record={activeReceipt} shopName={t.shopName} onClose={() => setActiveReceipt(null)} />
      <TweaksPanel open={tweaksOpen} onClose={() => setTweaksOpen(false)}>
        <div className="twk-sect">ข้อมูลร้าน</div>
        <div className="twk-row"><div className="twk-lbl">ชื่อร้าน</div><input className="twk-field" value={t.shopName} onChange={e => setTweak('shopName',e.target.value)}/></div>
        <div className="twk-row"><div className="twk-lbl">ชื่อ EN</div><input className="twk-field" value={t.shopEn} onChange={e => setTweak('shopEn',e.target.value)}/></div>
        <div className="twk-sect">ราคาสำรอง (ใช้เมื่อ API ขัดข้อง)</div>
        <div className="twk-row"><div className="twk-lbl">ทองแท่ง รับซื้อ</div><div className="twk-num-wrap"><input type="number" value={t.barBuy} step={50} onChange={e => setTweak('barBuy',Number(e.target.value))}/></div></div>
        <div className="twk-row"><div className="twk-lbl">ทองแท่ง ขายออก</div><div className="twk-num-wrap"><input type="number" value={t.barSell} step={50} onChange={e => setTweak('barSell',Number(e.target.value))}/></div></div>
        <div className="twk-sect">ความปลอดภัย</div>
        <div className="twk-row"><div className="twk-lbl">เปลี่ยน PIN ผู้จัดการ</div>
          <div style={{display:'flex',gap:6}}>
            <input id="new-pin-input" className="twk-field" type="password" inputMode="numeric" maxLength={8} placeholder="PIN ใหม่" style={{flex:1}}/>
            <button className="twk-btn-full" style={{width:'auto',padding:'0 10px'}} onClick={() => {
              const v = document.getElementById('new-pin-input').value.trim();
              if (v.length < 4) { alert('PIN ต้องมีอย่างน้อย 4 ตัว'); return; }
              localStorage.setItem(MANAGER_PIN_KEY, v);
              document.getElementById('new-pin-input').value = '';
              alert('เปลี่ยน PIN เรียบร้อย');
            }}>บันทึก</button>
          </div>
        </div>
        <div className="twk-sect">จัดการ</div>
        <button className="twk-btn-full" onClick={refresh} style={{marginBottom:6,background:'rgba(201,162,74,0.25)',color:'#c9a24a'}}>รีเฟรชราคา</button>
        <button className="twk-btn-full" onClick={() => { if(confirm('ล้างประวัติการคำนวณทั้งหมด?')) { setHistory([]); setCounter(1); } }}>ล้างประวัติทั้งหมด</button>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
