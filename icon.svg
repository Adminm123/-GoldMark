<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#b07d0f"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background (maskable safe zone = center 80%) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- subtle ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="5"/>
  <!-- G glyph -->
  <text x="260" y="352"
    text-anchor="middle"
    font-family="Georgia,'Times New Roman',serif"
    font-size="310"
    font-weight="700"
    font-style="italic"
    fill="rgba(26,18,8,0.82)">G</text>
</svg>
